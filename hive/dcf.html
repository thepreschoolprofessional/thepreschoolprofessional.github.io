<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DCF Binder - The Hive</title>
<style>
:root{--ink:#2b2b2b;--mut:#6b6b6b;--bg:#faf6ec;--card:#fff;--line:#e6dfc9;--gold:#f2b705;--grn:#2e8b57;--red:#c62828;--amb:#e08a00}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
#app{max-width:980px;margin:0 auto;padding:12px 16px 60px}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px;font-size:20px}
.sch{font-size:13px;background:var(--gold);padding:2px 8px;border-radius:10px;margin-left:6px}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar input{padding:7px;border:1px solid var(--line);border-radius:8px;font-size:15px}
.load{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tab{border:1px solid var(--line);background:#fff;border-radius:18px;padding:8px 14px;font-size:14px;white-space:nowrap;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.red{background:var(--red);color:#fff;border-radius:10px;padding:1px 7px;font-size:12px;font-weight:700}
.grn{color:#fff;background:var(--grn);border-radius:10px;padding:1px 7px;font-size:12px}
.btn.grn{padding:10px 16px;border-radius:10px;font-size:15px;border:0;cursor:pointer;color:#fff;background:var(--grn)}
.btn{display:inline-block;padding:10px 16px;border-radius:10px;border:0;background:var(--gold);color:var(--ink);font-size:15px;cursor:pointer;text-decoration:none}
.btn.sec{background:#fff;border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.ct{font-weight:700;font-size:16px;margin-bottom:4px}
.sub{color:var(--mut);font-size:13px;margin-bottom:8px}
.hint{color:var(--mut);font-size:12px;margin:6px 0}
.gw{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%}
.grid th,.grid td{border:1px solid var(--line);padding:4px;text-align:center;font-size:13px}
.grid th.rl{text-align:left;white-space:nowrap;background:#fbf8ee}
.cell{width:100%;min-width:44px;height:38px;border:0;border-radius:6px;font-size:16px;cursor:pointer}
.c-ok{background:#d9f2e2;color:var(--grn)}.c-warn{background:#fff0c9;color:var(--amb)}
.c-miss{background:var(--red);color:#fff}.c-today{background:#eee;color:var(--mut)}
.c-future,.c-na{background:#f6f6f6;color:#aaa}
.line{display:block;width:100%;text-align:left;padding:10px;margin:6px 0;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:14px}
.line.ok{background:#eef9f1}.line.bad{background:#fdecec;border-color:#f3b8b8;cursor:pointer;color:var(--ink)}
.okline{color:var(--grn);padding:6px 0}.miss{background:#fdecec;color:var(--red);padding:8px;border-radius:8px;margin:6px 0;font-size:14px}
.redt{color:var(--red)}
.mback{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 10px;z-index:50}
.mbox{background:#fff;border-radius:14px;padding:16px;max-width:620px;width:100%}
.mbox h3{margin:0 0 4px}
.items{max-height:48vh;overflow:auto;border:1px solid var(--line);border-radius:8px;margin:8px 0;padding:4px 8px}
.it{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #f1ecdb;font-size:14px}
.it input{margin-top:3px;width:18px;height:18px}
.lbl{display:block;font-size:13px;color:var(--mut);margin-top:8px}
.inp{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:15px}
.err{color:var(--red);min-height:18px;font-size:13px;margin-top:6px}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:99}
.toast.show{opacity:1}.toast.bad{background:var(--red)}
@media print{.bar,.tabs,.hbtn,.hint,.toast{display:none}body{background:#fff}.card{break-inside:avoid}}

.pt2h{text-align:center;margin:0 0 2px;font-size:19px}.pel{font-size:11px;font-weight:700;text-align:center;margin-bottom:6px}.parins{font-size:11.5px;line-height:1.3;margin:6px 0 8px}
table.par2{table-layout:fixed}.par2 th{font-size:12px;padding:4px 2px;font-weight:700}.par2 th.dh{width:34px}.par2 td.dn{width:34px;font-weight:700;padding:3px;font-size:14px}.par2 td.tl{font-weight:800}.par2 td.tot{font-weight:700;font-size:14px}.par2 input{padding:7px 2px;text-align:center;font-size:14px}
.sponsor .sh{font-weight:700;text-align:center;border-bottom:1px solid #333;margin-bottom:4px}.sponsor .ind{padding-left:70px}.sponsor .u{display:inline-block;min-width:70px;border-bottom:1px solid #333;margin:0 3px}
@media print{.par2 input{padding:2px}.par2 td.dn{font-size:12px}.parins{font-size:10px}.paper{font-size:11px}}
.paper{padding:18px}.lh{font:600 14px Arial;line-height:1.35;margin-bottom:8px}
.pt{text-align:center;margin:10px 0}.pm{text-align:center;font-size:18px;margin:6px 0}.pb{margin:12px 0 6px}
.ck2{display:flex;gap:10px;align-items:flex-start;margin:7px 0;font-size:15px}.ck2 input{width:20px;height:20px;margin-top:2px}
.ln{display:block;width:100%;border:0;border-bottom:1px solid #333;padding:8px 2px;font-size:15px;background:transparent;margin:6px 0}.ln.sm{display:inline-block;width:120px}
.rev{font-size:12px;margin-top:16px;color:#444}
table.pt2,table.par{width:100%;border-collapse:collapse}.pt2 th,.pt2 td,.par th,.par td{border:1px solid #333;padding:0;text-align:center;font-size:13px}
.pt2 input,.par input{width:100%;border:0;padding:7px 4px;font-size:14px;background:transparent;text-align:center}.pt2 input{text-align:left}
.par td:first-child{width:44px;padding:4px}.par .tot td{font-weight:700;padding:6px}
.parhead{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin:8px 0;font-size:14px}.parhead label{display:flex;gap:6px;align-items:center}
.cert{margin:12px 0 4px;font-size:14px}.sig3{display:grid;grid-template-columns:2fr 1.4fr 1fr;gap:10px}.sig3 label{font-size:12px}
.sponsor{border:1px solid #333;padding:10px;margin-top:12px;font-size:13px;line-height:1.8}
@media print{.noprint{display:none!important}.paper{border:0;padding:0}.pt2 input,.par input,.ln{color:#000}.par input:disabled{background:transparent}select{border:0;appearance:none;font-weight:700}}

.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:10px 0}@media(max-width:640px){.fgrid{grid-template-columns:1fr}}
.fl{display:block;font-size:13px;color:#444}.fi{display:block;width:100%;margin-top:3px;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:#fff}.rq{color:#c0392b;font-weight:700}
.fi.need,.ln.need{background:#fff3b0;border-color:#e0a800;box-shadow:0 0 0 2px #ffe58a}.ck2.need{background:#fff3b0;border-radius:8px;padding:4px 6px;box-shadow:0 0 0 2px #ffe58a}.paper.needbox{box-shadow:0 0 0 3px #ffe58a}
.warnbox{background:#fff3b0;border:1px solid #e0a800;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}.okline{background:#e6f4e6;border-radius:8px;padding:8px 10px;margin:8px 0}
.pt2 input.ws{width:100%}
@media print{.fi.need,.ln.need,.ck2.need{background:transparent;box-shadow:none;border-color:#333}.fi{border:0;border-bottom:1px solid #333;border-radius:0}.warnbox{display:none}}
.sponsor .spi{border:0;border-bottom:1px solid #333;background:transparent;padding:2px 4px;font-size:13px;text-align:center}

.ovwrap{padding:0!important;background:#fff}.ovp{position:relative;container-type:inline-size;width:100%;max-width:960px;margin:0 auto;font-size:var(--fs)}.ovp.land{max-width:1200px}.ovp>img{display:block;width:100%;height:auto}
.ovp .ovi,.ovp .ovc,.ovp .ovx,.ovp .ovt{position:absolute;box-sizing:border-box}.ovp .ovx{display:block}.ovp .ovx>input,.ovp .ovx>div{position:static}
.ovp input.ovi{background:transparent;border:0;border-bottom:1px solid rgba(0,0,0,.12);padding:0 .3em;margin:0;font:inherit;font-size:var(--fs);color:#0a2a8a;outline:0;border-radius:0;min-width:0}
.ovp input.ovi:focus{background:rgba(80,140,255,.14)}.ovp input.ovi.num{text-align:center}
.ovp input.ovi.need{background:rgba(255,226,60,.6)}.ovp input.ovc{margin:0;accent-color:#0a2a8a;width:1.5em;height:1.5em;transform:translate(-8%,-8%);}.ovp input.ovc.need{outline:2px solid #e0a800;background:#ffe58a}
.ovp .ovs{display:flex;align-items:center;height:100%;padding:0 .3em;color:#0a2a8a;font-size:var(--fs);white-space:nowrap;overflow:hidden}.ovp .ovs.sm{font-size:calc(var(--fs)*.85)}
.ovp .ovt{display:flex;align-items:center;justify-content:center;color:#0a2a8a;font-weight:700;width:100%;height:100%}
.ovp input:disabled{background:rgba(0,0,0,.06)}
.ovp input.ovi.ovl{margin-top:-.32em!important;font-weight:600;font-size:calc(var(--fs)*1.08);border-bottom:0}.ovp .ovwhite{background:#fff;pointer-events:none;z-index:2}
@media print{.ovwrap{border:0!important;box-shadow:none!important;margin:0!important}.ovp{max-width:none!important;width:100%}.ovp input.ovi{border-bottom:0!important}.ovp input.ovi.need,.ovp input.ovc.need{background:transparent!important;outline:0!important}.ovp input:disabled{background:transparent}body.pl-land{} }
.ovsig{position:absolute;box-sizing:border-box;cursor:pointer;border-bottom:1px dashed rgba(10,42,138,.45);display:flex;align-items:center;justify-content:center;background:rgba(80,140,255,.08)}.ovsig span{color:rgba(10,42,138,.55);font-size:calc(var(--fs)*.8)}.ovsig img{max-width:100%;max-height:100%;object-fit:contain}
.padov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999;display:flex;align-items:center;justify-content:center;padding:12px}.padbox{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:760px}.padbox canvas{width:100%;height:auto;aspect-ratio:700/220;border:2px dashed #888;border-radius:10px;background:#fff;display:block;margin:8px 0}
.qf .qfrow{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}.qf .qfrow b{min-width:150px}.qf .qh{width:90px}
@media print{.ovsig{background:none!important;border-bottom:0!important}.ovsig span{display:none}}
</style></head>
<body><div id="app"><div class="card">Loading&hellip;</div></div>
<script src="dcf-forms.js?v=14"></script>
<script src="dcf.js?v=28"></script>
</body></html>
