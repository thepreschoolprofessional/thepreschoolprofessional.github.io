<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Hive Portal PINs - The Hive</title>
<style>
:root{--bg:#f3fbf9;--ink:#2b2118;--card:#fff;--line:#cfe6e1;--acc:#00796b;--mut:#6a7a77}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:14px 16px;background:#fff;border-bottom:2px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:20px;margin:0;flex:1}button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-size:15px;cursor:pointer}
main{max-width:820px;margin:0 auto;padding:14px}.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 8px;color:var(--acc)}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:16px}
.row:first-of-type{border-top:0}.pin{font-weight:800;letter-spacing:2px;font-variant-numeric:tabular-nums;font-size:19px}.sub{color:var(--mut);font-size:13px;margin-top:6px}.msg{padding:30px;text-align:center;color:var(--mut)}
@media print{button{display:none}}
</style></head><body>
<header><button onclick="location.href='director.html'">← Director portal</button><h1>🔐 Hive Portal PINs</h1><button onclick="window.print()">Print</button></header>
<main id="app"><div class="msg">Loading…</div></main>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var app=document.getElementById('app'),pin='';
try{pin=sessionStorage.getItem('hivePin')||''}catch(e){}
if(!pin){app.innerHTML='<div class="msg">Please open this from the Director Portal.</div>'}else{
fetch('director-pins-api.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:pin})}).then(function(r){return r.json()}).then(function(d){
 if(d.error){app.innerHTML='<div class="msg">'+esc(d.error)+'</div>';return}
 var h='<div class="sec"><h2>'+esc(d.school)+' - Hive portals</h2>'+d.hive.map(function(x){return'<div class="row"><span>'+esc(x.label)+'</span><span class="pin">'+esc(x.pin)+'</span></div>'}).join('')+'<div class="sub">These change when someone leaves or every two months. Give the Teacher PIN to teachers in person or by text, never in a group channel that a former employee can still see.</div></div>'
 +'<div class="sec"><h2>Bear Line PINs</h2><div class="sub">Each parent and each staff member has their own Bear Line PIN. Look them up on the <b>Family and Staff PINs</b> card (parents by classroom, staff on their own tab).</div></div>'
 +'<div class="sub">This page is for directors only. It clears itself after 3 minutes.</div>';
 app.innerHTML=h;setTimeout(function(){app.innerHTML='<div class="msg">Locked. Open it again from the Director Portal.</div>'},180000);
}).catch(function(){app.innerHTML='<div class="msg">Could not load. Please try again.</div>'})}
</script></body></html>
