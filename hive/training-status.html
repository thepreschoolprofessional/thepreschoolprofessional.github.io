<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Staff Training Status - The Hive</title>
<style>*{box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}body{margin:0;background:linear-gradient(160deg,#fff7ef,#ffe7d4);color:#4a3a30;padding:14px 14px 60px}main{max-width:900px;margin:0 auto}h1{margin:8px 0}a.b{display:inline-block;background:#fff;border:1px solid #eadfce;border-radius:10px;padding:8px 14px;font-weight:800;color:#4a3a30;text-decoration:none;margin-right:6px}
.c{background:#fff;border-radius:14px;padding:12px 14px;margin:10px 0;box-shadow:0 3px 10px rgba(74,58,48,.1)}.c h3{margin:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tot{margin-left:auto;font-size:.85rem;color:#9b8576}
.p{display:inline-block;border-radius:8px;padding:3px 9px;margin:4px 4px 0 0;font-size:.85rem;font-weight:700}.ok{background:#e3f4e8;color:#1b6b3a}.wait{background:#fff4e0;color:#8a5a00}.none{color:#c62828;font-weight:700}</style><script src="bl-brand.js?v=20261113b" defer></script>
</head><body><main>
<a class="b" href="director.html">&larr; Back</a><a class="b" href="staff-files.html">Staff Files (sign)</a>
<h1>📋 Staff Training Status</h1><div id="sub" style="color:#9b8576;font-weight:600"></div><div id="m">Loading…</div></main>
<script>
var PIN=sessionStorage.getItem('hivePin');if(!PIN)location.href='index.html';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function card(p,nw){var t=0,w=0;p.certs.forEach(function(c){t+=Number(c.hrs)||0;if(!c.signed)w++});
 return '<div class="c"><h3>'+esc(p.name)+(nw?' <span class="p wait">new name - match to staff file</span>':'')+'<span class="tot">'+p.certs.length+' lesson'+(p.certs.length==1?'':'s')+' · '+(Math.round(t*100)/100)+' hrs'+(w?' · '+w+' to sign':'')+'</span></h3>'
 +(p.certs.length?p.certs.map(function(c){return '<span class="p '+(c.signed?'ok':'wait')+'">'+(c.signed?'✓ signed':'⏳ to sign')+' · '+esc(c.title||c.lesson)+' · '+esc(c.date)+'</span>'}).join(''):'<div class="none" style="margin-top:6px">No training recorded this year</div>')+'</div>';}
fetch('files-api.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:PIN,action:'training_status'})}).then(function(r){return r.json()}).then(function(j){if(j.error)throw new Error(j.error);
 document.getElementById('sub').textContent=j.school+' · training recorded in '+j.year;
 var st=j.staff.slice().sort(function(a,b){return a.certs.length-b.certs.length||a.name.localeCompare(b.name)});
 document.getElementById('m').innerHTML=(j.pending||[]).map(function(p){return card(p,1)}).join('')+st.map(function(p){return card(p)}).join('')}).catch(function(e){document.getElementById('m').textContent=e.message||'Could not load.'});
</script></body></html>
