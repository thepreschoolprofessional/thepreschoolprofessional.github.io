<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>My PINs - The Hive</title>
<style>
:root{--bg:#fff6fa;--ink:#2b2118;--card:#fff;--line:#ecd3df;--acc:#5a4cc9;--mut:#7a6a75}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:14px 16px;background:#fff;border-bottom:2px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:20px;margin:0;flex:1}button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-size:15px;cursor:pointer}
main{max-width:820px;margin:0 auto;padding:14px}.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 8px;color:var(--acc)}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:16px}
.row:first-of-type{border-top:0}.pin{font-weight:800;letter-spacing:2px;font-variant-numeric:tabular-nums}.sub{color:var(--mut);font-size:13px}.msg{padding:30px;text-align:center;color:var(--mut)}
@media print{button{display:none}}
</style><script src="bl-brand.js?v=20261113b" defer></script>
</head><body>
<header><h1>🔑 My PINs (Owner only)</h1><button onclick="window.print()">Print</button></header>
<main id="app"><div class="msg">Loading…</div></main>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var pin=null;
try{var now=Date.now();for(var i=localStorage.length-1;i>=0;i--){var k=localStorage.key(i);if(k&&k.indexOf('hiveOwnerPinHandoff_')===0){var ts=+k.split('_')[1];if(now-ts<60000&&!pin)pin=localStorage.getItem(k);localStorage.removeItem(k)}}}catch(e){}
var app=document.getElementById('app');
if(!pin){app.innerHTML='<div class="msg">Please open this from the Owner Portal.</div>'}else{
fetch('owner-pins-api.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:pin})}).then(function(r){return r.json()}).then(function(d){
 pin=null;if(d.error){app.innerHTML='<div class="msg">'+esc(d.error)+'</div>';return}
 var h='<div class="sec"><h2>Hive portals</h2>'+d.hive.map(function(x){return'<div class="row"><span>'+esc(x.label)+'</span><span class="pin">'+esc(x.pin)+'</span></div>'}).join('')+'</div>';
 d.bearline.forEach(function(b){
  h+='<div class="sec"><h2>Bear Line - '+esc(b.school)+'</h2>';
  if(b.error){h+='<div class="sub">'+esc(b.error)+'</div></div>';return}
  h+=b.staff.map(function(x){return'<div class="row"><span>'+esc(x.name)+' <span class="sub">'+esc(x.role)+' (staff screen and director area)</span></span><span class="pin">'+esc(x.pin)+'</span></div>'}).join('')||'<div class="sub">No owner or director PINs found.</div>';
  h+=b.test.map(function(x){return'<div class="row"><span>Test child '+esc(x.child)+' <span class="sub">(parent sign-in test)</span></span><span class="pin">'+esc(x.pin)+'</span></div>'}).join('');
  h+='</div>'});
 h+='<div class="sub">This page is for you only. It clears itself after 3 minutes.</div>';
 app.innerHTML=h;setTimeout(function(){app.innerHTML='<div class="msg">Locked. Open it again from the Owner Portal.</div>'},180000);
}).catch(function(){app.innerHTML='<div class="msg">Could not load. Please try again.</div>'})}
</script></body></html>
