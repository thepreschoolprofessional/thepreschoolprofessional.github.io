<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Bear Classroom Pack - Kid City USA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap"><link rel="manifest" href="room-manifest.json"><meta name="theme-color" content="#fbf8f1"><link rel="apple-touch-icon" href="room-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#fbf8f1;--surface:#fff;--sunk:#f3ecdc;--ink:#2b2117;--muted:#7a6a55;--line:#e6dcc6;--honey:#e8a317;--honey-soft:#fdf0cf;--ok:#2f8a4f;--ok-soft:#e2f3e8;--warn:#b86e00;--warn-soft:#fff1d6;--bad:#c2372f;--bad-soft:#fde6e3;--info:#2d6aa3;--info-soft:#e3eef9;--peach:#fde7d3;--orange:#e8730c;--sch:#c98a0b;--f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;--f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--r:18px}
body.deland{--sch:#e0457b}
*{box-sizing:border-box}body{margin:0;font-family:var(--f-body);background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top,0px)}
header{max-width:820px;margin:0 auto;padding:14px 16px 8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}.brand img{height:46px;width:auto}.brand b{font-family:var(--f-display);font-size:25px;font-weight:700;display:block;line-height:1.05}.brand small{color:var(--muted);font-size:13px}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none}.pill.sch{background:var(--sch);border-color:var(--sch);color:#fff}
header .dt{width:100%;color:var(--muted);font-size:13px;margin-top:-2px}
.stripe{max-width:820px;margin:0 auto;height:5px;border-radius:5px;background:linear-gradient(90deg,var(--honey),var(--sch))}
main{max-width:820px;margin:0 auto;padding:14px 16px 8px}
.ttl{font-family:var(--f-display);font-size:28px;font-weight:700;margin:2px 0 12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}@media(min-width:620px){.tiles{grid-template-columns:repeat(5,1fr)}}
.tile{position:relative;border:2px solid transparent;border-radius:var(--r);padding:12px 8px;text-align:center;font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.15;cursor:pointer;color:var(--ink)}
.tile:nth-child(1){background:var(--info-soft)}.tile:nth-child(2){background:var(--peach)}.tile:nth-child(3){background:var(--ok-soft)}.tile:nth-child(4){background:var(--honey-soft)}.tile:nth-child(5){background:#f1e6fa}
.tile .e{font-size:28px;display:block;margin-bottom:2px}.tile small{display:block;font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:12px;margin-top:3px}
.tile.on{border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
h2{margin:0 0 4px;font-family:var(--f-display);font-size:21px;font-weight:600;color:var(--ink)}.sub{color:var(--muted);font-size:14px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.chip{border-radius:12px;padding:7px 8px;font-size:12px;line-height:1.1;text-align:center;cursor:pointer;border:2px solid transparent;min-width:46px}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.flag{background:var(--bad-soft);color:var(--bad)}.chip.none{background:var(--sunk);color:#a99978;cursor:default}.chip.sel{border-color:var(--ink)}
.chart{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;background:#fffdf8}
.chart .top{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin-bottom:6px}.badge{font-size:12px;border-radius:20px;padding:2px 10px}.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.flag{background:var(--bad-soft);color:var(--bad)}
.it{padding:6px 0;border-top:1px solid var(--sunk);font-size:15px}.it.bad{color:var(--bad);font-weight:600}
.bio{display:flex;gap:12px;border-top:1px solid var(--line);padding:12px 0}.bio:first-child{border-top:0}.bio img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--honey);flex:none}.bio .ph{width:84px;height:84px;border-radius:50%;background:var(--sunk);flex:none}
.bio b{font-family:var(--f-display);font-size:18px;font-weight:600}.bio .r{color:var(--muted);font-size:13px;margin-bottom:4px}.bio p{margin:0;font-size:15px;line-height:1.4}
.alert{background:var(--bad-soft);border:2px solid var(--bad);color:#8c1d16;border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-weight:700}.alert a{display:inline-block;margin-top:8px;background:var(--orange);color:#fff;text-decoration:none;border-radius:99px;padding:10px 18px;font-size:15px;font-family:var(--f-display)}
.tile .miss{color:var(--bad);font-weight:800;font-size:12px;display:block;margin-top:3px}.msg{padding:26px;text-align:center;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:6px 16px 26px}.foot a{color:var(--muted)}
@media print{.tiles,.chips{display:none}}
</style></head><body>
<header><div class="brand"><img src="bp-logo.png" alt="Bear Phonics Academy" onerror="this.style.display='none'"><div><b>Bear Line</b><small>Classroom Pack</small></div></div><span class="pill sch" id="sc">Kid City USA</span><div class="dt" id="dt"></div></header><div class="stripe"></div>
<main><h1 class="ttl" id="rn">Posted items</h1><div id="app" class="msg">Loading...</div></main>
<div class="foot"><a href="room.html?pick=1" style="color:#667">Change classroom</a><br>Bear Line Classroom Pack &middot; Kid City USA &middot; these records update live as staff complete them. Showing the last 2 months.</div>
<script src="sop-data.js?v=9"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var q=new URLSearchParams(location.search),S=q.get('s')||'',R=q.get('r')||'',D=null,cur=(q.get('t')&&['classroom','bathroom','indoor','schedule','bios'].indexOf(q.get('t'))>=0)?q.get('t'):'classroom',selDate={};
var SEC={classroom:['🧹','Classroom Cleaning Chart','Every day, last 2 months'],bathroom:['🚽','Bathroom Cleaning Chart','Every day, last 2 months'],indoor:['🏠','Daily Indoor Inspection','Every day, last 2 months'],schedule:['🗓','Daily Schedule','Today\'s classroom routine'],bios:['👩‍🏫','Meet Our Teachers','Staff bios and photos']};
function fd(s){var p=s.split('-');return (+p[1])+'/'+(+p[2])}
function dow(s){return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(s+'T12:00:00').getDay()]}
function days(){var o=[],t=new Date(D.today+'T12:00:00');for(var i=0;i<62;i++){var d=new Date(t-i*864e5);if(d.getDay()===0||d.getDay()===6)continue;o.push(d.toISOString().slice(0,10))}return o}
function wk(s){var g=new Date(s+'T12:00:00').getDay();return g>0&&g<6}
function missing(k){if(k==='bios'||k==='schedule'||!D||!wk(D.today))return false;return !(D.charts[k]||[]).some(function(c){return c.date===D.today})}
var SOPR={sanford:{honeybees:['Honeybees - Tod./Inf.'],vpk:['VPK/Pre-School (Pollen-Jocks)'],schoolagers:['Schoolagers (Worker Bees)']},deland:{honeybees:['Honey Bees - Tod. Front'],honeycombs:["Three's - Honey Combs","Four's - Honey Combs"],infant:['Infant/Toddler']}},wedView=null;
function t12(x){try{return SOP.fmt(x)}catch(e){return x}}
function nowMin(){var p=new Date().toLocaleTimeString('en-GB',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit'}).split(':');return +p[0]*60+ +p[1]}
function mm(x){var p=String(x).split(':');return +p[0]*60+ +p[1]}
function schedHtml(){
 var key=(S==='deland')?'DeLand 2':'Sanford',names=(SOPR[S]||{})[R]||[],M=null;
 try{M=SOP.merge(key,{rooms:(D.sop&&Object.keys(D.sop).length)?D.sop:null})}catch(e){}
 if(!M||!names.length)return '<div class="sec"><h2>🗓 Daily Schedule</h2><div class="msg">This room\'s schedule is being added. Check back soon.</div></div>';
 var isWed=new Date(D.today+'T12:00:00').getDay()===3,useWed=(wedView===null)?isWed:wedView,h='<div class="sec"><h2>🗓 Daily Schedule</h2><div class="sub">'+esc(D.room)+'. The highlighted row is what should be happening right now.</div>';
 var any=names.some(function(n){return M.rooms[n]&&M.rooms[n].wed});
 if(any)h+='<div class="chips" style="margin-bottom:10px"><div class="chip '+(!useWed?'ok sel':'none')+'" onclick="wedView=false;draw()">Regular day<br><b>Mon Tue Thu Fri</b></div><div class="chip '+(useWed?'ok sel':'none')+'" onclick="wedView=true;draw()">Wednesday<br><b>Early release</b></div></div>';
 var n0=nowMin(),live=wk(D.today)&&(useWed===isWed);
 names.forEach(function(n){var r=M.rooms[n];if(!r)return;var L=(useWed&&r.wed)?r.wed:(r.blocks||[]);
  h+='<div class="chart"><div class="top"><span><b>'+esc(n.replace(/ - /g,' - '))+'</b></span>'+((useWed&&r.wed)?'<span class="badge ok">Early release</span>':'')+'</div>';
  L.forEach(function(b){var on=live&&mm(b.s)<=n0&&n0<mm(b.e);h+='<div class="it" style="display:flex;gap:10px;'+(on?'background:#fff3cf;border-left:4px solid #f2b632;font-weight:800':'')+'"><span style="min-width:132px;color:#8a5a00;font-weight:700">'+esc(t12(b.s)+' - '+t12(b.e))+'</span><span>'+esc(b.t)+(b.f?' <span style="font-weight:400;color:#667;font-size:12px">(fixed time)</span>':'')+(on?'  ◀ NOW':'')+'</span></div>'});
  h+='</div>'});
 return h+'</div>'}
function draw(){
 var h='<div class="tiles">'+Object.keys(SEC).map(function(k){return'<div class="tile'+(k===cur?' on':'')+'" onclick="cur=\''+k+'\';draw()"><span class="e">'+SEC[k][0]+'</span>'+SEC[k][1]+'<small>'+SEC[k][2]+'</small>'+(missing(k)?'<span class="miss">NOT DONE TODAY</span>':'')+'</div>'}).join('')+'</div>';
 if(cur==='schedule'){h+=schedHtml()}else if(cur==='bios'){
  h+='<div class="sec"><h2>👩‍🏫 Meet Our Teachers</h2><div class="sub">Teachers at '+esc(D.school)+'</div>'+(D.bios.length?D.bios.map(function(b){return'<div class="bio">'+(b.photo?'<img src="data:image/jpeg;base64,'+b.photo+'">':'<div class="ph"></div>')+'<div><b>'+esc(b.name)+'</b><div class="r">'+esc(b.role)+'</div><p>'+esc(b.bio)+'</p></div></div>'}).join(''):'<div class="msg">Teacher bios are being added. Check back soon.</div>')+'</div>';
 }else{
  var L=D.charts[cur]||[],by={};L.forEach(function(c){(by[c.date]=by[c.date]||[]).push(c)});
  var ds=days(),have=ds.filter(function(d){return by[d]}),sel=selDate[cur]||have[0]||null;
  if(missing(cur))h+='<div class="alert">⚠️ Today\'s '+SEC[cur][1]+' has NOT been completed yet. Teachers: please sign in and do it right now so it shows up here.<br><a href="'+esc(D.signin)+'" target="_blank">Sign in and complete it now</a><div style="font-weight:400;font-size:13px;margin-top:6px">Sign in with your PIN, then tap "Do my cleaning chart and daily checklists".</div></div>';
  h+='<div class="sec"><h2>'+SEC[cur][0]+' '+SEC[cur][1]+'</h2><div class="sub">'+esc(D.room)+'. Tap a day to see that day\'s chart. Green = completed, red = something needed attention, gray = no chart recorded.</div><div class="chips">'+ds.map(function(d){var b=by[d],c=!b?'none':(b.some(function(x){return x.status==='flag'})?'flag':'ok');return'<div class="chip '+c+(d===sel?' sel':'')+'"'+(b?' onclick="selDate[cur]=\''+d+'\';draw()"':'')+'>'+dow(d)+'<br><b>'+fd(d)+'</b></div>'}).join('')+'</div>';
  if(!sel)h+='<div class="msg">No charts recorded in the last 2 months.</div>';
  else h+='<div class="sub"><b>'+dow(sel)+' '+fd(sel)+'</b></div>'+by[sel].map(function(c){return'<div class="chart"><div class="top"><span>Completed by '+esc(c.by||'staff')+(c.at?' at '+new Date(c.at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit',timeZone:'America/New_York'}):'')+'</span><span class="badge '+c.status+'">'+(c.status==='ok'?'All OK':'Needs attention')+'</span></div>'+c.items.map(function(i){return'<div class="it'+(i.ok?'':' bad')+'">'+(i.ok?'✅ ':'⚠️ ')+esc(i.t)+'</div>'}).join('')+'</div>'}).join('');
  h+='</div>';
 }
 document.getElementById('app').className='';document.getElementById('app').innerHTML=h;
}
var PICK=[['sanford','honeybees','Sanford: Honeybees (Toddler/Infant)'],['sanford','vpk','Sanford: VPK / Pre-School (Pollen-Jocks)'],['sanford','schoolagers','Sanford: Schoolagers (Worker Bees)'],['deland','honeybees','DeLand 2: Honey Bees (Toddlers, Front)'],['deland','honeycombs','DeLand 2: Honey Combs'],['deland','infant','DeLand 2: Infant / Toddler Room']];
if(!S||!R){try{var sv=JSON.parse(localStorage.getItem('bearRoomPick')||'null');if(sv&&sv.s&&sv.r&&!q.get('pick')){S=sv.s;R=sv.r}}catch(e){}}
if(!S||!R){document.getElementById('rn').textContent='Bear Classroom Pack';document.getElementById('sc').textContent='Kid City USA';document.getElementById('app').className='';document.getElementById('app').innerHTML='<div class="sec"><h2>Pick this tablet\'s classroom</h2><div class="sub">The tablet will remember it and open straight to this room each time.</div>'+PICK.filter(function(p){return !S||p[0]===S}).map(function(p){return'<div class="tile" style="margin-bottom:10px" onclick="try{localStorage.setItem(\'bearRoomPick\',JSON.stringify({s:\''+p[0]+'\',r:\''+p[1]+'\'}))}catch(e){}location.href=\'room.html?s='+p[0]+'&r='+p[1]+'\'">'+esc(p[2])+'</div>'}).join('')+'</div>'}else{
try{if(q.get('app'))localStorage.setItem('bearRoomPick',JSON.stringify({s:S,r:R}))}catch(e){}
 var APP=document.getElementById('app');
 function getPass(){try{var x=JSON.parse(localStorage.getItem('roomPass_'+S)||'null');if(x&&x.p&&x.e>Date.now())return x.p}catch(e){}return ''}
 function post(o){o.s=S;o.r=R;return fetch('room-api.php',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify(o)}).then(function(r){return r.json()})}
 function msg(h){APP.className='';APP.innerHTML='<div class="sec" style="text-align:center;padding:26px 18px">'+h+'</div>'}
 function again(){return "<p><button onclick='location.reload()' style='font:inherit;padding:12px 26px;border-radius:12px;border:0;background:#e8730c;color:#fff;font-weight:700'>Try again / Intentar de nuevo</button></p>"}
 function locate(){
  msg("<p style='font-size:20px'><b>Checking that you are at the school...</b><br>Verificando que está en la escuela...</p><p>Please tap <b>Allow</b> if your phone asks for your location.<br>Toque <b>Permitir</b> si su teléfono pide su ubicación.</p>");
  var done=false;
  function send(lat,lng,acc){post({act:'loc',lat:lat,lng:lng,acc:acc}).then(function(r){
   if(r&&r.ok){try{localStorage.setItem('roomPass_'+S,JSON.stringify({p:r.pass,e:Date.now()+19*60000}))}catch(e){}load();}
   else if(r&&r.error==='too_far')msg("<p style='font-size:20px'><b>These classroom pages can only be opened at the school.</b><br>Estas páginas solo se pueden abrir en la escuela.</p><p>Scan the poster in the classroom again when you are here.<br>Escanee el cartel en el salón cuando esté aquí.</p>"+again());
   else if(r&&r.error==='slow_down')msg("<p>Too many tries. Please wait a few minutes.<br>Demasiados intentos. Espere unos minutos.</p>");
   else if(r&&r.error==='no_location')msg("<p style='font-size:20px'><b>Location is needed.</b> Turn on location for your browser, then try again.<br>Se necesita su ubicación. Actívela y vuelva a intentar.</p>"+again());
   else msg("<p>This page could not check the school location right now. Please tell the director.<br>No se pudo verificar la ubicación. Avise a la directora.</p>"+again());
  }).catch(function(){msg("<p>Can't reach the server. Check your connection.</p>"+again())})}
  if(!navigator.geolocation){send(null,null,0);return}
  navigator.geolocation.getCurrentPosition(function(p){if(done)return;done=true;send(p.coords.latitude,p.coords.longitude,p.coords.accuracy||0)},function(){if(done)return;done=true;send(null,null,0)},{enableHighAccuracy:true,timeout:20000,maximumAge:0});
 }
 function load(){var pass=getPass();if(!pass){locate();return}
  post({pass:pass}).then(function(d){
  if(d.error==='need_location'){try{localStorage.removeItem('roomPass_'+S)}catch(e){}locate();return}
  if(d.error){APP.textContent=d.error;return}
  D=d;document.getElementById('sc').textContent='Kid City USA '+d.school;document.body.className=(S==='deland')?'deland':'sanford';document.getElementById('rn').textContent=d.room;
  document.getElementById('dt').textContent=new Date(d.today+'T12:00:00').toLocaleDateString([], {weekday:'long',month:'long',day:'numeric',year:'numeric'});document.title=d.room+' - Posted Items';draw();
 }).catch(function(){APP.textContent='Could not load. Please try again.'})}
 load()}
</script></body></html>
