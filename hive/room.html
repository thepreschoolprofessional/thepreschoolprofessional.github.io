<style>

header{max-width:820px;margin:0 auto;padding:14px 16px 8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}.brand img{height:46px;width:auto}.brand b{font-family:var(--f-display);font-size:25px;font-weight:700;display:block;line-height:1.05}.brand small{color:var(--muted);font-size:13px}

.tile:nth-child(1){background:var(--info-soft)}.tile:nth-child(2){background:var(--peach)}.tile:nth-child(3){background:var(--ok-soft)}.tile:nth-child(4){background:var(--honey-soft)}.tile:nth-child(5){background:#f1e6fa}

.bio b{font-family:var(--f-display);font-size:18px;font-weight:600}.bio .r{color:var(--muted);font-size:13px;margin-bottom:4px}.bio p{margin:0;font-size:15px;line-height:1.4}
.alert{background:var(--bad-soft);border:2px solid var(--bad);color:#8c1d16;border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-weight:700}.alert a{display:inline-block;margin-top:8px;background:var(--orange);color:#fff;text-decoration:none;border-radius:99px;padding:10px 18px;font-size:15px;font-family:var(--f-display)}
.tile .miss{color:var(--bad);font-weight:800;font-size:12px;display:block;margin-top:3px}.msg{padding:26px;text-align:center;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:6px 16px 26px}.foot a{color:var(--muted)}

<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var q=new URLSearchParams(location.search),S=q.get('s')||'',R=q.get('r')||'',D=null,cur=(q.get('t')&&['signin','classroom','bathroom','indoor','schedule','forms','bios','food','allergy'].indexOf(q.get('t'))>=0)?q.get('t'):'signin',selDate={};
var SEC={signin:['✅','Sign Children In / Out','Tap a child'],classroom:['🧹','Classroom Cleaning Chart','Every day, last 2 months'],bathroom:['🚽','Bathroom Cleaning Chart','Every day, last 2 months'],indoor:['🏠','Daily Indoor Inspection','Every day, last 2 months'],schedule:['🗓','Daily Schedule','Today\'s classroom routine'],food:['🍎','Food Program Attendance','Weekly form, print'],allergy:['⚠️','Allergies','See and add'],incident:['🩹','Incident Reports','Write and see reports'],forms:['🖨️','Official Forms','Pick dates and print'],bios:['👩‍🏫','Meet Our Teachers','Staff bios and photos']};
function fd(s){var p=s.split('-');return (+p[1])+'/'+(+p[2])}
function dow(s){return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(s+'T12:00:00').getDay()]}
function days(){var o=[],t=new Date(D.today+'T12:00:00');for(var i=0;i<62;i++){var d=new Date(t-i*864e5);if(d.getDay()===0||d.getDay()===6)continue;o.push(d.toISOString().slice(0,10))}return o}

var SI={list:null,msg:'',busy:false,by:''};try{SI.by=localStorage.getItem('bearRoomBy')||''}catch(e){}
function t12(x){if(!x)return'';var m=/^(\d{1,2}):(\d{2})/.exec(x);if(!m)return x;var h=+m[1],p=h>=12?'PM':'AM';h=h%12||12;return h+':'+m[2]+' '+p}
function signHtml(){
 if(SI.list===null&&!SI.busy){siLoad()}
 var h='<div class="sec"><h2>✅ Sign Children In / Out</h2><div class="sub">'+esc(D.room)+'. Only the children in this classroom. Type your name once, then tap IN or OUT. It updates the Rooms board and attendance right away.</div>'
  +'<label class="sub" style="display:block;margin:6px 0 2px;font-weight:700">Your name</label><input id="siBy" value="'+esc(SI.by)+'" oninput="SI.by=this.value;try{localStorage.setItem(\'bearRoomBy\',this.value)}catch(e){}" placeholder="Type your name" autocomplete="off" style="width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);margin-bottom:10px">'
  +(SI.msg?'<div class="alert" style="margin-bottom:10px">'+esc(SI.msg)+'</div>':'');
 if(SI.list===null)return h+'<div class="msg">Loading the class list...</div></div>';
 if(!SI.list.length)return h+'<div class="msg">No children are on this classroom\'s list.</div></div>';
 var inN=SI.list.filter(function(k){return k.in&&!k.out}).length;
 h+='<div class="sub"><b>'+inN+'</b> here now &middot; '+SI.list.length+' on the list</div>';
 h+=SI.list.map(function(k){var st=k.in&&!k.out?'in':(k.in&&k.out?'out':'none'),nm=encodeURIComponent(k.name);
  var tag=st==='in'?'<span class="badge ok">In '+t12(k.in)+'</span>':(st==='out'?'<span class="badge flag" style="background:var(--sunk);color:var(--muted)">Out '+t12(k.out)+'</span>':'<span class="badge" style="background:var(--sunk);color:var(--muted)">Not here yet</span>');
  var bt=function(d,l,c){return'<button onclick="siGo(\''+nm+'\',\''+d+'\')" style="font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 16px;margin-left:6px;cursor:pointer;'+c+'">'+l+'</button>'};
  var btns=st==='in'?bt('out','Sign OUT','background:var(--honey);color:#2a1b00')+bt('undoin','Undo','background:#fff;border:2px solid var(--line);color:var(--muted)'):(st==='out'?bt('in','Back IN','background:var(--ok);color:#fff')+bt('undoout','Undo','background:#fff;border:2px solid var(--line);color:var(--muted)'):bt('in','Sign IN','background:var(--ok);color:#fff'));
  return'<div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px;justify-content:space-between;border-top:1px solid var(--sunk);padding:10px 0"><div><b>'+esc(k.name)+'</b>'+(k.visiting?' <small>(visiting)</small>':'')+'<br>'+tag+'</div><div>'+btns+'</div></div>'}).join('');
 return h+'</div>'}
function siLoad(){SI.busy=true;post({pass:getPass(),act:'kids'}).then(function(r){SI.busy=false;if(r.error==='need_location'){try{localStorage.removeItem('roomPass_'+S)}catch(e){}locate();return}if(r.error){SI.msg=r.error;SI.list=SI.list||[]}else{SI.list=r.kids||[];SI.msg=''}draw()}).catch(function(){SI.busy=false;SI.list=SI.list||[];SI.msg='Could not load. Check the connection and try again.';draw()})}
function siGo(nm,d){var by=(SI.by||'').trim();if(!by){SI.msg='Type your name first.';draw();document.getElementById('siBy')&&document.getElementById('siBy').focus();return}
 if(SI.busy)return;SI.busy=true;SI.msg='';post({pass:getPass(),act:'sign',child:decodeURIComponent(nm),dir:d,by:by}).then(function(r){SI.busy=false;if(r.error==='need_location'){try{localStorage.removeItem('roomPass_'+S)}catch(e){}locate();return}if(r.error){SI.msg=r.error}else{SI.list=r.kids||SI.list}draw()}).catch(function(){SI.busy=false;SI.msg='Did not save. Check the connection and try again.';draw()})}
function doChart(d){var p=getPass();if(!p){locate();return}location.href='clean.html#r='+encodeURIComponent(p)+'&s='+encodeURIComponent(S)+'&k='+encodeURIComponent(R)+'&t='+encodeURIComponent(cur)+(d?'&d='+d:'')}
var CLOSED=['2026-07-03','2026-07-31','2026-09-07','2026-11-11','2026-11-26','2026-11-27','2026-12-23','2026-12-24','2026-12-25','2027-01-01','2027-01-18','2027-03-26','2027-05-31','2027-06-18'];
function missing(k){if(k==='signin'||k==='bios'||k==='schedule'||k==='forms'||!D||!wk(D.today))return false;return !(D.charts[k]||[]).some(function(c){return c.date===D.today})}
var SOPR={sanford:{honeybees:['Honeybees - Tod./Inf.'],vpk:['VPK/Pre-School (Pollen-Jocks)'],schoolagers:['Schoolagers (Worker Bees)']},deland:{honeybees:['Honey Bees - Tod. Front'],honeycombs:["Three's - Honey Combs","Four's - Honey Combs"],infant:['Infant/Toddler']}},wedView=null;
function t12(x){try{return SOP.fmt(x)}catch(e){return x}}
function nowMin(){var p=new Date().toLocaleTimeString('en-GB',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit'}).split(':');return +p[0]*60+ +p[1]}
function mm(x){var p=String(x).split(':');return +p[0]*60+ +p[1]}
function schedHtml(){
 var key=(S==='deland')?'DeLand 2':'Sanford',names=(SOPR[S]||{})[R]||[],M=null;
 try{M=SOP.merge(key,{rooms:(D.sop&&Object.keys(D.sop).length)?D.sop:null})}catch(e){}
 if(!M||!names.length)return '<div class="sec"><h2>🗓 Daily Schedule</h2><div class="msg">This room\'s schedule is being added. Check back soon.</div></div>';
 var isWed=new Date(D.today+'T12:00:00').getDay()===3,useWed=(wedView===null)?isWed:wedView,h='<div class="sec"><h2>🗓 Daily Schedule</h2><div class="sub">'+esc(D.room)+'. The highlighted row is what should be happening right now.</div>';
 var any=names.some(function(n){return M.rooms[n]&&M.rooms[n].wed});
 if(any)h+='<div class="chips" style="margin-bottom:10px"><div class="chip '+(!useWed?'ok sel':'none')+'" onclick="wedView=false;draw()">Regular day<br><b>Mon Tue Thu Fri</b></div><div class="chip '+(useWed?'ok sel':'none')+'" onclick="wedView=true;draw()">Wednesday<br><b>Early release</b></div></div>';
 var n0=nowMin(),live=wk(D.today)&&(useWed===isWed);
 names.forEach(function(n){var r=M.rooms[n];if(!r)return;var L=(useWed&&r.wed)?r.wed:(r.blocks||[]);
  h+='<div class="chart"><div class="top"><span><b>'+esc(n.replace(/ - /g,' - '))+'</b></span>'+((useWed&&r.wed)?'<span class="badge ok">Early release</span>':'')+'</div>';
  L.forEach(function(b){var on=live&&mm(b.s)<=n0&&n0<mm(b.e);h+='<div class="it" style="display:flex;gap:10px;'+(on?'background:#fff3cf;border-left:4px solid #f2b632;font-weight:800':'')+'"><span style="min-width:132px;color:#8a5a00;font-weight:700">'+esc(t12(b.s)+' - '+t12(b.e))+'</span><span>'+esc(b.t)+(b.f?' <span style="font-weight:400;color:#667;font-size:12px">(fixed time)</span>':'')+(on?'  ◀ NOW':'')+'</span></div>'});
  h+='</div>'});
 return h+'</div>'}
var FM={from:'',to:'',pick:{bee:true,bath:true,ind:true},busy:false,msg:'',url:''};
function isoAdd(s,n){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function formsHtml(){
 var min=isoAdd(D.today,-62),max=D.today;if(!FM.from){FM.from=isoAdd(D.today,-13);FM.to=D.today}
 var h='<div class="sec"><h2>🖨️ Official Forms</h2><div class="sub">'+esc(D.room)+'. These are the real Kid City forms filled in from what staff completed. Pick the dates you need, choose the forms, then tap Make my forms.</div>'
 +'<div class="alert" style="background:#fdf0cf;border-color:#e8a317;color:#5a4a1c"><b>Only the last 2 months are shown here.</b> If you need older forms, please ask your director. Older forms are kept in the vault.</div>'
 +'<div style="display:flex;gap:10px;flex-wrap:wrap;margin:12px 0"><label style="flex:1;min-width:140px;font-weight:700">From<input type="date" id="fmf" value="'+FM.from+'" min="'+min+'" max="'+max+'" onchange="FM.from=this.value" style="display:block;width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:4px"></label>'
 +'<label style="flex:1;min-width:140px;font-weight:700">To<input type="date" id="fmt" value="'+FM.to+'" min="'+min+'" max="'+max+'" onchange="FM.to=this.value" style="display:block;width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:4px"></label></div>'
 +[['bee','Classroom Cleaning Chart (Bee Clean Chart)'],['bath','Bathroom Cleaning Log'],['ind','Daily Indoor Inspection']].map(function(x){return'<label style="display:block;padding:6px 0;font-size:16px"><input type="checkbox" '+(FM.pick[x[0]]?'checked ':'')+'onchange="FM.pick[\''+x[0]+'\']=this.checked" style="width:20px;height:20px;vertical-align:middle;margin-right:8px">'+x[1]+'</label>'}).join('')
 +'<p><button onclick="makeForms()" id="fmb" style="font:inherit;font-weight:700;padding:13px 26px;border-radius:12px;border:0;background:var(--orange,#e8730c);color:#fff">'+(FM.busy?'Making your forms...':'Make my forms')+'</button></p>'
 +'<div id="fmo">'+(FM.msg?'<div class="msg">'+FM.msg+'</div>':'')+(FM.url?'<p><a href="'+FM.url+'" target="_blank" style="display:inline-block;padding:13px 26px;border-radius:12px;background:#2e8b57;color:#fff;font-weight:700;text-decoration:none">Open and print</a> &nbsp; <a href="'+FM.url+'" download="Official-Forms.pdf" style="font-weight:700">Save a copy</a></p>':'')+'</div>'
 +'<div class="sub">Each page is one month (cleaning charts) or one week (indoor inspection) with only the days you picked filled in. The director signs the inspection form. Days that were not completed stay blank.</div></div>';
 return h}
function makeForms(){
 if(FM.busy)return;var f=FM.from,t=FM.to,min=isoAdd(D.today,-62);
 var pick=['bee','bath','ind'].filter(function(k){return FM.pick[k]});
 FM.url='';
 if(!f||!t){FM.msg='Pick a From and a To date.';draw();return}
 if(f>t){FM.msg='The From date is after the To date.';draw();return}
 if(f<min){FM.msg='Only the last 2 months are available here. Please ask your director for older forms. They are kept in the vault.';draw();return}
 if(!pick.length){FM.msg='Tick at least one form.';draw();return}
 FM.busy=true;FM.msg='';draw();
 var s=document.createElement('script');
 function go(){RoomForms.build(D,f,t>D.today?D.today:t,pick).then(function(r){FM.busy=false;if(!r.pages){FM.msg='No completed forms were found for those dates and forms.';draw();return}
  try{FM.url=URL.createObjectURL(new Blob([r.bytes],{type:'application/pdf'}))}catch(e){}FM.msg=r.pages+' page'+(r.pages>1?'s':'')+' ready.';draw()}).catch(function(e){FM.busy=false;FM.msg=esc(e.message||'Could not make the forms. Please try again.');draw()})}
 if(window.RoomForms)go();else{s.src='room-forms.js?v=2';s.onload=go;s.onerror=function(){FM.busy=false;FM.msg='Could not load the form tools. Check your connection.';draw()};document.head.appendChild(s)}
}
function pk(o){o.s=S;o.p='classroom';o.pass=getPass();return fetch('pack-api.php',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify(o)}).then(function(r){return r.json()})}
function mountAllergy(){var el=document.getElementById('mnt');if(!el)return;AllergyUI.mount(el,{post:pk,room:R,roomLabel:D.room,dtok:null,src:'Classroom QR'})}

function mountFood(){var el=document.getElementById('mnt');if(!el)return;el.innerHTML='<div class="sec"><div class="msg">Loading...</div></div>';
 pk({act:'rooms'}).then(function(r){var l=(r.rooms||[]).filter(function(x){return x.slug===R}).map(function(x){return x.name});if(!l.length){el.innerHTML='<div class="sec"><div class="msg">'+esc(r.error||'Room not found.')+'</div></div>';return}
  FoodForm.mount(el,{school:D.school,today:D.today,rooms:l,allowAll:l.length>1,post:pk})})}
function draw(){
 var h='<div class="tiles">'+Object.keys(SEC).map(function(k){return'<div class="tile'+(k===cur?' on':'')+'" onclick="cur=\''+k+'\';draw()"><span class="e">'+SEC[k][0]+'</span>'+SEC[k][1]+'<small>'+SEC[k][2]+'</small>'+(missing(k)?'<span class="miss">NOT DONE TODAY</span>':'')+'</div>'}).join('')+'</div>';
 if(cur==='food'||cur==='allergy'||cur==='incident'){h+='<div id="mnt"></div>'}else if(cur==='schedule'){h+=schedHtml()}else if(cur==='signin'){h+=signHtml()}else if(cur==='forms'){h+=formsHtml()}else if(cur==='bios'){
  bioStyle();h+='<div class="sec"><h2>👩‍🏫 Meet Our Teachers</h2><div class="sub">Teachers at '+esc(D.school)+'</div>'+(D.bios.length?'<div class="bcs">'+D.bios.map(function(b){return bioCard(b,D.school)}).join('')+'</div>':'<div class="msg">Teacher bios are being added. Check back soon.</div>')+'</div>';
 }else{
  var L=D.charts[cur]||[],by={};L.forEach(function(c){(by[c.date]=by[c.date]||[]).push(c)});
  var ds=days(),have=ds.filter(function(d){return by[d]}),sel=selDate[cur]||have[0]||null;

  if(missing(cur))h+='<div class="alert">⚠️ Today\'s '+SEC[cur][1]+' has NOT been completed yet. Tap the green button below to fill it out right now. No PIN needed.</div>';
  h+=go;

  if(!sel)h+='<div class="msg">No charts recorded in the last 2 months.</div>';
  else h+='<div class="sub"><b>'+dow(sel)+' '+fd(sel)+'</b></div>'+by[sel].map(function(c){return'<div class="chart"><div class="top"><span>Completed by '+esc(c.by||'staff')+(c.at?' at '+new Date(c.at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit',timeZone:'America/New_York'}):'')+'</span><span class="badge '+c.status+'">'+(c.status==='ok'?'All OK':'Needs attention')+'</span></div>'+c.items.map(function(i){return'<div class="it'+(i.ok?'':' bad')+'">'+(i.ok?'✅ ':'⚠️ ')+esc(i.t)+'</div>'}).join('')+'</div>'}).join('');
  h+='</div>';
 }
 document.getElementById('app').className='';document.getElementById('app').innerHTML=h;
 if(cur==='food')mountFood();if(cur==='allergy')mountAllergy();if(cur==='incident')mountIncident();
}

if(!S||!R){try{var sv=JSON.parse(localStorage.getItem('bearRoomPick')||'null');if(sv&&sv.s&&sv.r&&!q.get('pick')){S=sv.s;R=sv.r}}catch(e){}}
if(!S||!R){document.getElementById('rn').textContent='Bear Classroom Pack';document.getElementById('sc').textContent='Kid City USA';document.getElementById('app').className='';document.getElementById('app').innerHTML='<div class="sec"><h2>Pick this tablet\'s classroom</h2><div class="sub">The tablet will remember it and open straight to this room each time.</div>'+PICK.filter(function(p){return !S||p[0]===S}).map(function(p){return'<div class="tile" style="margin-bottom:10px" onclick="try{localStorage.setItem(\'bearRoomPick\',JSON.stringify({s:\''+p[0]+'\',r:\''+p[1]+'\'}))}catch(e){}location.href=\'room.html?s='+p[0]+'&r='+p[1]+'\'">'+esc(p[2])+'</div>'}).join('')+'</div>'}else{

 var APP=document.getElementById('app');
 function getPass(){try{var x=JSON.parse(localStorage.getItem('roomPass_'+S)||'null');if(x&&x.p&&x.e>Date.now())return x.p}catch(e){}return ''}
 function post(o){o.s=S;o.r=R;return fetch('room-api.php',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify(o)}).then(function(r){return r.json()})}
 function msg(h){APP.className='';APP.innerHTML='<div class="sec" style="text-align:center;padding:26px 18px">'+h+'</div>'}
 function again(){return "<p><button onclick='location.reload()' style='font:inherit;padding:12px 26px;border-radius:12px;border:0;background:#e8730c;color:#fff;font-weight:700'>Try again / Intentar de nuevo</button></p>"}
 function locate(){
  msg("<p style='font-size:20px'><b>Checking that you are at the school...</b><br>Verificando que está en la escuela...</p><p>Please tap <b>Allow</b> if your phone asks for your location.<br>Toque <b>Permitir</b> si su teléfono pide su ubicación.</p>");
  var done=false;
  function send(lat,lng,acc){post({act:'loc',lat:lat,lng:lng,acc:acc}).then(function(r){
   if(r&&r.ok){try{localStorage.setItem('roomPass_'+S,JSON.stringify({p:r.pass,e:Date.now()+19*60000}))}catch(e){}load();}
   else if(r&&r.error==='too_far')msg("<p style='font-size:20px'><b>These classroom pages can only be opened at the school.</b><br>Estas páginas solo se pueden abrir en la escuela.</p><p>Scan the poster in the classroom again when you are here.<br>Escanee el cartel en el salón cuando esté aquí.</p>"+again());
   else if(r&&r.error==='slow_down')msg("<p>Too many tries. Please wait a few minutes.<br>Demasiados intentos. Espere unos minutos.</p>");
   else if(r&&r.error==='no_location')msg("<p style='font-size:20px'><b>Location is needed.</b> Turn on location for your browser, then try again.<br>Se necesita su ubicación. Actívela y vuelva a intentar.</p>"+again());
   else msg("<p>This page could not check the school location right now. Please tell the director.<br>No se pudo verificar la ubicación. Avise a la directora.</p>"+again());
  }).catch(function(){msg("<p>Can't reach the server. Check your connection.</p>"+again())})}
  if(!navigator.geolocation){send(null,null,0);return}
  navigator.geolocation.getCurrentPosition(function(p){if(done)return;done=true;send(p.coords.latitude,p.coords.longitude,p.coords.accuracy||0)},function(){if(done)return;done=true;send(null,null,0)},{enableHighAccuracy:true,timeout:20000,maximumAge:0});
 }
 function load(){var pass=getPass();if(!pass){locate();return}
  post({pass:pass}).then(function(d){
  if(d.error==='need_location'){try{localStorage.removeItem('roomPass_'+S)}catch(e){}locate();return}
  if(d.error){APP.textContent=d.error;return}
  D=d;document.getElementById('sc').textContent='Kid City USA '+d.school;document.body.className=(S==='deland')?'deland':'sanford';document.getElementById('rn').textContent=d.room;
  document.getElementById('dt').textContent=new Date(d.today+'T12:00:00').toLocaleDateString([], {weekday:'long',month:'long',day:'numeric',year:'numeric'});document.title=d.room+' - Posted Items';draw();
 }).catch(function(){APP.textContent='Could not load. Please try again.'})}
 load()}
