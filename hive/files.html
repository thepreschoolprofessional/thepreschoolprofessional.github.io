<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--ink:#4a3a30;--soft:#9b8576;--line:#eadfce;--grn:#2e8b57;--blu:#1565c0;--org:#ef6c00;--red:#d32f2f;--amb:#e08a00}
*{box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{margin:0;background:linear-gradient(160deg,#fff7ef,#ffe7d4);color:var(--ink);min-height:100vh;padding-bottom:80px;line-height:1.45}
#app{max-width:860px;margin:0 auto;padding:12px 14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.top h1{font-size:1.4rem;margin:0}.sub{color:var(--soft);font-weight:700;font-size:.9rem}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:800;font-size:.95rem;cursor:pointer;background:var(--ink);color:#fff;text-decoration:none;display:inline-block}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.grn{background:var(--grn)}.btn.blu{background:var(--blu)}.btn.red{background:var(--red)}
.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.5}
.fi{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin:4px 0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.bar .fi{flex:1;min-width:180px;margin:0}
.pr{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 3px 10px rgba(74,58,48,.1);display:flex;gap:10px;align-items:center;cursor:pointer;border:0;text-align:left;width:100%;margin:8px 0}
.pr b{display:block}.pr small{color:var(--soft)}
.pbtn{border:0;cursor:pointer;font-family:inherit}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-weight:800;font-size:.8rem;color:#fff;white-space:nowrap}
.p-red{background:var(--red)}.p-amb{background:var(--amb)}.p-ok{background:var(--grn)}.p-opt{background:#a99b90}
.pr .pills{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.signpill{background:var(--red);animation:pls 1.4s infinite}
@keyframes pls{0%,100%{box-shadow:0 0 0 0 rgba(211,47,47,.5)}50%{box-shadow:0 0 0 7px rgba(211,47,47,0)}}
.card{background:#fff;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 3px 10px rgba(74,58,48,.1)}
.card h3{margin:0 0 6px}
.doc{border-top:1px solid #f1e7d8;padding:12px 0}.doc:first-of-type{border-top:0}
.doc .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.doc .hd b{flex:1;min-width:180px}
.doc.bad{background:#fff3f3;margin:0 -8px;padding:12px 8px;border-radius:10px}
.fl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:.88rem}
.fl a,.fl button.lk{color:var(--blu);font-weight:700;cursor:pointer;background:none;border:0;padding:0;text-decoration:underline;font-size:.88rem}
.ex{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:.88rem;font-weight:700}.ex input{padding:6px;border:1px solid var(--line);border-radius:8px;font-size:15px}
.msg{min-height:20px;font-weight:700;color:var(--grn);margin:6px 0}.msg.bad{color:var(--red)}
.cert{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cert.need{border:2px solid var(--red);background:#fff3f3}
.cert .t{flex:1;min-width:180px}.cert small{color:var(--soft);display:block}
.sigimg{height:34px;border-bottom:1px solid #999}
.hrs{height:12px;background:#eee;border-radius:7px;overflow:hidden;margin:6px 0}.hrs i{display:block;height:100%;background:var(--grn)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal .box{background:#fff;border-radius:16px;padding:16px;max-width:520px;width:100%}
#sg{width:100%;height:170px;border:2px dashed #999;border-radius:10px;touch-action:none;background:#fff}

<script>
(function(){var V='20261105h';try{fetch(location.pathname+'?chk='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){var m=t.match(/var V='([^']+)'/);if(m&&m[1]!==V&&!sessionStorage.getItem('hiveReloaded'+m[1])){sessionStorage.setItem('hiveReloaded'+m[1],'1');location.replace(location.pathname+location.search+(location.search?'&':'?')+'v='+m[1]);}});}catch(e){}})();

<script>
const PIN=sessionStorage.getItem('hivePin');
if(!PIN) location.href='index.html';
const KIND=/kind=student/.test(location.search)?'student':'staff';
const ST=KIND==='staff';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let SCHOOL='',PEOPLE=[],FILTER='all',Q='',CUR=null;
async function api(action,x){
 const r=await fetch('files-api.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({pin:PIN,action,kind:KIND},x||{}))});
 const j=await r.json().catch(()=>({error:'Server error. Try again in a minute.'}));
 if(j.error)throw new Error(j.error);return j;}
function say(id,t,bad){const m=$(id);if(!m)return;m.textContent=t||'';m.className='msg'+(bad?' bad':'');}
const LBL={missing:['Missing','p-red'],expired:['Expired','p-red'],soon:['Expires soon','p-amb'],needdate:['Add expiration date','p-amb'],ok:['On file','p-ok'],optional:['Not needed unless it applies','p-opt']};
function dur(h){h=Number(h);return h<1?Math.round(h*60)+' min':(Math.round(h*100)/100)+' hr';}
function fmt(d){if(!d)return '';const p=d.split('-');return p[1]+'/'+p[2]+'/'+p[0];}

/* ---------- list ---------- */
async function boot(){
 try{const w=await api('whoami');SCHOOL=w.school;if(w.role!=='director'){throw new Error('Files are only available to directors and the owner.');}}
 catch(e){$('app').innerHTML='<div class="card"><b>'+esc(e.message)+'</b><p><a class="btn" href="index.html">Back to sign in</a></p></div>';return;}
 await listView();
 try{const u=new URLSearchParams(location.search);if(u.get('open')){await openP(u.get('open'));const dk=u.get('doc');if(dk){const el=document.getElementById('d_'+dk);if(el){el.scrollIntoView({block:'center'});el.style.outline='3px solid #d32f2f';}}}}catch(e){}}
async function listView(){
 CUR=null;
 $('app').innerHTML='<div class="top"><div><h1>'+(ST?'🗂️ Staff Files':'🧒 Student Files')+'</h1><div class="sub">'+esc(SCHOOL)+'</div></div><a class="btn sec" href="'+(sessionStorage.getItem('hiveOwner')?'owner.html':'director.html')+'">‹ Back to portal</a></div>'
 +'<div class="bar"><input class="fi" id="q" placeholder="Search '+(ST?'staff':'students')+'…" oninput="Q=this.value;draw()"><button class="btn sm sec" id="fa" onclick="setF(\'all\')">All</button><button class="btn sm sec" id="fn" onclick="setF(\'need\')">Needs attention</button><button class="btn sm sec" id="ff" onclick="setF(\'former\')">'+(ST?'Former staff':'Withdrawn')+'</button><button class="btn sm grn" onclick="addOpen()">➕ Add '+(ST?'staff':'child')+'</button></div><div id="plist"><div class="sub">Loading…</div></div>';
 try{const j=await api('roster');PEOPLE=j.people;draw();}catch(e){$('plist').innerHTML='<div class="msg bad">'+esc(e.message)+'</div>';}}
async function setF(f){FILTER=f;
 if(f==='former'){$('plist').innerHTML='<div class="sub">Loading…</div>';try{FORMER=(await api('roster',{former:true})).people;}catch(e){$('plist').innerHTML='<div class="msg bad">'+esc(e.message)+'</div>';return;}}
 draw();}
let FORMER=[];
function draw(){
 const q=Q.trim().toLowerCase();
 let SRC=FILTER==='former'?FORMER:PEOPLE;
 let l=SRC.filter(p=>(!q||p.name.toLowerCase().indexOf(q)>=0)&&(FILTER==='all'||FILTER==='former'||p.red||p.amber||p.sign));
 l.sort((a,b)=>(b.sign?1:0)-(a.sign?1:0)||(b.red-a.red)||a.name.localeCompare(b.name));
 if($('fa')){$('fa').className='btn sm '+(FILTER==='all'?'':'sec');$('fn').className='btn sm '+(FILTER==='need'?'':'sec');$('ff').className='btn sm '+(FILTER==='former'?'':'sec');}
 const tot=PEOPLE.reduce((a,p)=>a+p.red,0),sg=PEOPLE.reduce((a,p)=>a+(p.sign||0),0);
 $('plist').innerHTML=(!ST&&FILTER!=='former'?'<div class="card" style="border:2px solid #7b3fb8;background:#f8f1ff"><b>🏷️ Cubby &amp; bin labels</b><div class="sub" style="margin:2px 0 8px">Prints each child\'s photo with first name and last initial, grouped by room. Only children with a photo release on file and a cubby photo are included.</div><button class="btn sm" style="background:#7b3fb8" onclick="printLabels()">Print labels for '+esc(SCHOOL)+'</button><span class="msg" id="lbm"></span></div>':'')+'<div class="sub" style="margin:4px 0">'+PEOPLE.length+' '+(ST?'staff':'students')+' · '+tot+' missing or expired item'+(tot===1?'':'s')+(ST&&sg?' · <span style="color:var(--red)">'+sg+' certificate'+(sg===1?'':'s')+' to sign</span>':'')+'</div>'
 +(FILTER==='former'?'<div class="sub" style="margin:4px 0">Their files are kept. Tap a name to open the file or put them back.</div>':'')+(l.length?l.map(p=>'<button class="pr" onclick="openP(\''+p.id+'\')"><span><b>'+esc(p.name)+'</b><small>'+esc(p.sub||'')+'</small></span><span class="pills">'
   +(p.sign?'<span class="pill signpill">✍ '+p.sign+' to sign</span>':'')
   +(p.driveSort?'<span class="pill" style="background:#fff3c4;color:#8a6100">📥 in Drive</span>':'')
   +(p.red?'<span class="pill p-red">'+p.red+' missing</span>':'')
   +(p.amber?'<span class="pill p-amb">'+p.amber+' check</span>':'')
   +(!p.red&&!p.amber&&!p.sign?'<span class="pill p-ok">Complete</span>':'')+'</span></button>').join(''):'<div class="card">Nobody matches.</div>');}

/* ---------- one person ---------- */
async function openP(id){
 $('app').innerHTML='<div class="sub">Opening…</div>';
 try{CUR=await api('person',{id});}catch(e){$('app').innerHTML='<div class="card msg bad">'+esc(e.message)+'</div><button class="btn sec" onclick="listView()">‹ Back</button>';return;}
 pView();window.scrollTo(0,0);}
function pView(){
 const c=CUR;let h='<div class="top"><div><h1>'+esc(c.name)+'</h1><div class="sub">'+esc(SCHOOL)+(c.sub?' · '+esc(c.sub):'')+(c.dob?' · born '+fmt(c.dob):'')+'</div></div><button class="btn sec" onclick="listView()">‹ '+(ST?'All staff':'All students')+'</button></div>';
 h+='<div class="msg" id="gm"></div>';
 if(c.former){h+='<div class="card" style="border:2px solid var(--amb);background:#fff8e6"><b>'+(ST?'No longer on the staff list':'Withdrawn')+'</b>'+(c.left&&c.left.date?' · '+fmt(c.left.date):'')+(c.left&&c.left.reason?' · '+esc(c.left.reason):'')+'<div class="sub">Their file is kept. You can still add pages.</div><button class="btn sm grn" onclick="reinst()">↩ Put back on the '+(ST?'staff list':'roster')+'</button></div>';}
 if(ST&&c.certs){h+=certBlock(c);}
 if(!ST&&!c.practice&&!c.former){h+='<div class="card" style="border:2px solid #1a73e8;background:#f3f8ff"><b>ELC / School Readiness</b><div class="sub" style="margin:2px 0 6px">Turn this on for School Readiness children. It adds the ELC payment certificate to the list below, with its expiration date and a red alert before it runs out.</div>'
  +'<label style="display:block;margin:4px 0"><input type="checkbox" '+(c.sr?'checked':'')+' onchange="flag(\'sr\',this.checked)"> <b>School Readiness (ELC) child</b></label>'
  +(c.sr?'<label style="display:block;margin:4px 0"><input type="checkbox" '+(c.atrisk?'checked':'')+' onchange="flag(\'atrisk\',this.checked)"> <b>At-risk child</b> <span class="sub">(ELC needs notice the same day they are absent)</span></label>':'')+'</div>';}
 if(!ST&&!c.former&&!c.practice){h+='<div class="card" style="border:2px solid #7b3fb8;background:#f8f1ff"><b>🧸 Cubby &amp; bin photo</b>'
  +(c.photoOk?'<div style="display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap"><div id="faceBox" style="width:96px;height:96px;border-radius:12px;background:#e9dcf7;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:2rem">'+(c.face?'…':'🧒')+'</div><div><div class="sub" style="margin-bottom:6px">Kept private in this child\'s file. Used only for cubby and bin labels.</div><label class="btn sm blu" style="margin:0">📷 '+(c.face?'Retake':'Take')+' photo<input type="file" accept="image/*" capture="user" style="display:none" onchange="faceUp(this)"></label> <label class="btn sm sec" style="margin:0">📎 Choose photo<input type="file" accept="image/*" style="display:none" onchange="faceUp(this)"></label>'+(c.face?' <button class="btn sm sec" style="color:var(--red)" onclick="faceDel()">Remove</button>':'')+'</div></div>'
   :'<div class="sub" style="margin-top:6px;color:var(--amb)">A photo release must be on file first. Add the <b>Photo / video release</b> below (or tap Mark on file), then come back here.</div>')+'</div>';}
 if(ST&&!c.former&&!c.practice){h+='<div class="card" style="border:2px solid #E0A100;background:#fff8e1"><b>🐝 Bio card &amp; photo</b><div class="sub" style="margin:2px 0 6px">A short bio and photo for the parent page. Staff can fill it in themselves on the teacher page (My Bio), or you can do it here.</div><div id="bioBox"><button class="btn sm" style="background:#E0A100" onclick="bioOpen()">Open bio card</button></div></div>';}
 if(ST&&!c.practice){h+='<div class="card" style="border:2px solid #81c784;background:#f1faf2"><b>🏖 Time off (Schedules &amp; Requests)</b><div class="sub" style="margin:2px 0 6px">Approved and denied Employee Vacation Requests are filed here automatically. Only directors see this.</div><div id="toBox"><div class="sub">Loading…</div></div></div>';setTimeout(toLoad,60);}
 if(c.driveFolder){h+='<div class="card" style="border:2px solid #1a73e8;background:#eef4ff"><b>📂 Too big to upload, or short on time?</b><div class="sub" style="margin:4px 0 8px">Put the whole packet (scan, photos or PDF, any size) in this person\'s private Drive folder. Then tap the yellow button so it gets split into the right spots.</div><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn sm blu" style="text-decoration:none" target="_blank" rel="noopener" href="'+esc(c.driveFolder)+'">📂 Open '+esc(c.name)+'\'s Drive folder</a><button class="btn sm '+(c.driveSort?'grn':'sec')+'" onclick="driveSort('+(c.driveSort?0:1)+')">'+(c.driveSort?'✔ Waiting to be sorted · tap to undo':'📥 Packet is in Drive, please sort it')+'</button></div></div>';}
 h+='<div class="card"><h3>'+(ST?'What this file needs':'What this folder needs')+'</h3><div class="sub" style="margin-bottom:6px">Tap Take photo for each page (or choose a PDF). Red means it is missing or out of date.</div>';
 c.docs.forEach(function(d){
  const s=LBL[d.status];
  h+='<div id="d_'+d.key+'" class="doc'+((d.status==='missing'||d.status==='expired')?' bad':'')+'"><div class="hd"><b>'+esc(d.label)+(d.req?'':' <small style="color:var(--soft);font-weight:600">(only if it applies)</small>')+'</b>'+pillHtml(d,s)+'</div>';
  if(d.hint)h+='<div class="sub" style="font-size:.82rem">'+esc(d.hint)+'</div>';
  if(d.needsExp)h+='<div class="ex">Expires: <input type="date" value="'+esc(d.exp)+'" onchange="setExp(\''+d.key+'\',this.value)">'+(d.nodate?' <span style="color:var(--amb)">add the date so it can be tracked</span>':'')+'</div>';
  if(d.files.length)h+='<div class="fl">'+d.files.map(function(f,i){return '<span><button class="lk" onclick="view(\''+esc(f.name)+'\')">Page '+(i+1)+'</button> <button class="lk" style="color:#999" onclick="rm(\''+esc(f.name)+'\')">remove</button></span>';}).join('')+'</div>';
  if(d.drive)h+='<div class="fl"><a class="lk" target="_blank" rel="noopener" href="'+esc(d.drive.url)+'">📄 '+esc(d.drive.label||'Page in Drive')+' (opens the Drive page)</a></div>';
  if(!ST&&ACK[d.key])h+='<div class="fl"><button class="btn sm" style="background:#2e7d32" onclick="signOpen(\''+d.key+'\')">✍ Parent signs on screen</button></div>';
  h+='<div class="fl"><label class="btn sm blu" style="margin:0">📷 Take photo<input type="file" accept="image/*" capture="environment" style="display:none" onchange="up(\''+d.key+'\',this)"></label>'
   +'<label class="btn sm sec" style="margin:0">📎 Choose file or PDF<input type="file" accept="image/*,application/pdf" multiple style="display:none" onchange="up(\''+d.key+'\',this)"></label></div></div>';});
 h+='</div>';
 if(!c.former&&!c.practice)h+='<div style="text-align:center;margin:18px 0"><button class="btn sm sec" style="color:var(--red)" onclick="remOpen()">Remove '+(ST?'this staff member':'this child')+' from the '+(ST?'staff list':'roster')+'</button></div>';
 $('app').innerHTML=h;if(!ST&&CUR.face&&CUR.photoOk)faceShow();}
async function refresh(){CUR=await api('person',{id:CUR.id});pView();}
function pillHtml(d,s){
 if(d.status==='missing'||d.status==='optional')return '<button class="pill pbtn '+s[1]+'" onclick="markDoc(\''+d.key+'\',1)">'+(d.status==='missing'?'Missing · tap if you have it':'Tap if you have it')+'</button>';
 if(d.marked)return '<span class="pill p-ok">On file (marked)</span> <button class="lk" style="background:none;border:0;color:#999;text-decoration:underline;font-size:.8rem;cursor:pointer" onclick="markDoc(\''+d.key+'\',0)">undo</button>';
 if(d.drive&&d.drive.verified)return '<span class="pill p-ok">On file (Drive)</span>';
 return '<span class="pill '+s[1]+'">'+s[0]+'</span>';}
async function flag(k,v){try{const b={id:CUR.id};b[k]=!!v;await api('setflag',b);await refresh();say('gm','Saved.');}catch(e){say('gm',e.message,1);await refresh();}}
async function markDoc(doc,on){
 if(on&&!confirm('Mark this as on file? Use this when you have the paper copy. You can still add photos any time.'))return;
 try{await api('mark',{id:CUR.id,doc,on});await refresh();say('gm',on?'Marked on file.':'Marked missing again.');}catch(e){say('gm',e.message,1);}}
async function driveSort(on){try{await api('drive_sort',{id:CUR.id,on:!!on});CUR.driveSort=!!on;pView();say('gm',on?'Marked. The packet will be split into this file.':'Cleared.');}catch(e){say('gm',e.message,1);}}
async function setExp(doc,v){try{await api('setexp',{id:CUR.id,doc,exp:v});await refresh();say('gm','Saved.');}catch(e){say('gm',e.message,1);}}

/* photos are shrunk before sending so they upload fast on a phone */
function shrink(file){return new Promise(function(ok){
 if(!/^image\//.test(file.type)){const r=new FileReader();r.onload=()=>ok({b64:r.result.split(',')[1],name:file.name});r.onerror=()=>ok(null);r.readAsDataURL(file);return;}
 const u=URL.createObjectURL(file),im=new Image();
 im.onload=function(){const M=1800,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
  ok({b64:c.toDataURL('image/jpeg',0.82).split(',')[1],name:file.name.replace(/\.\w+$/,'')+'.jpg'});};
 im.onerror=function(){URL.revokeObjectURL(u);const r=new FileReader();r.onload=()=>ok({b64:r.result.split(',')[1],name:file.name});r.onerror=()=>ok(null);r.readAsDataURL(file);};
 im.src=u;});}
async function up(doc,inp){
 const fs=[].slice.call(inp.files);inp.value='';if(!fs.length)return;
 let n=0;
 for(const f of fs){
  say('gm','Saving page '+(n+1)+' of '+fs.length+'…');
  const s=await shrink(f);if(!s){say('gm','Could not read that file.',1);return;}
  try{await api('upload',{id:CUR.id,doc,name:s.name,b64:s.b64});n++;}catch(e){say('gm',(e.message||'Upload failed')+(n?' ('+n+' saved)':'')+(CUR.driveFolder?' — or put it in their Drive folder (top of this page) and tap the yellow button.':''),1);if(n)await refresh();return;}}
 await refresh();say('gm',n+' page'+(n===1?'':'s')+' saved to '+CUR.name+'\'s file.');}

/* ---------- parent signs on screen (acknowledgment forms) ---------- */
const ACK={
 disc:{t:'Discipline and Expulsion Policy Receipt',s:'I received the center\'s discipline and expulsion policy and I have had the chance to read it and ask questions.'},
 broch:{t:'Know Your Child Care Facility Brochure Receipt (CF/PI 175-24)',s:'I received the "Know Your Child Care Facility" brochure (CF/PI 175-24).'},
 hb:{t:'Parent Handbook Receipt',s:'I received the parent handbook and I agree to follow the center\'s policies in it.'},
 nut:{t:'Nutrition and Physical Activity Policy Receipt',s:'I received the center\'s food and nutrition policy (including allergens) and physical activity policy.'},
 dd:{t:'Distracted Driver Information',s:'I received the information about children left in vehicles (distracted driver).',yr:1},
 flu:{t:'Influenza Information',s:'I received the information about influenza and the flu vaccine.',yr:1},
 photo:{t:'Photo and Video Release',s:'Photo and video of my child may be used by the center as I choose below.',choice:['I give permission','I do not give permission']},
 foodp:{t:'Food and Activity Permission',s:'My child may take part in the center\'s food activities as I choose below.',choice:['I give permission','I do not give permission']}
};
let SG={};
function signOpen(doc){
 const a=ACK[doc];const d=CUR.docs.filter(x=>x.key===doc)[0]||{};
 let h='<h3 style="margin:0 0 6px">'+esc(a.t)+'</h3><div class="sub" style="margin-bottom:8px">Child: <b>'+esc(CUR.name)+'</b> · '+esc(SCHOOL)+'</div><div class="card" style="margin:0 0 8px">'+esc(a.s)+'</div>';

 try{await api('face_set',{id:CUR.id,b64:b});window._bioPhoto=b;const bx=$('faceBox');if(bx)bx.innerHTML='<img alt="" style="width:100%;height:100%;object-fit:cover" src="data:image/jpeg;base64,'+b+'">';if($('bprev')&&$('bbio'))bioPrev();say('gm','Photo saved.');}catch(e){say('gm',e.message,1);}}
async function bioSave(){try{const r=await api('bio_save',{id:CUR.id,a:bioAns(),bio:$('bbio').value,approved:$('bapp').checked});say('gm',r.approved?'Saved. Families can now see this bio.':'Saved.');await bioOpen();}catch(e){say('gm',e.message,1);}}
</script></body></html>
