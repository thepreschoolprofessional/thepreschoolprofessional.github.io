<style>
:root{--ink:#2b2118;--bg:#fbd3e0;--line:#f0a9c2}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);padding:14px 16px 60px;max-width:720px;margin:0 auto}
h1{font-size:1.6rem;margin:10px 0 2px}.sub{color:#6b5a4a;margin-bottom:14px}
.gate{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px;margin-top:20px}
.gate input{width:100%;padding:14px;font-size:1.3rem;text-align:center;letter-spacing:6px;border:2px solid var(--line);border-radius:12px;margin:10px 0}
button.go{width:100%;padding:14px;border:0;border-radius:12px;background:#4e342e;color:#fff;font-weight:900;font-size:1.1rem;cursor:pointer}
.err{color:#b71c1c;font-weight:700;min-height:22px;margin-top:6px}
.school{background:#fff;border:2px solid var(--line);border-radius:18px;margin:16px 0;overflow:hidden}
.school h2{margin:0;padding:14px 16px;color:#fff;font-size:1.25rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.grid button{border:0;border-radius:14px;padding:16px 10px;font-weight:900;font-size:1rem;color:#fff;cursor:pointer;line-height:1.25}
.grid small{display:block;font-weight:400;opacity:.9;font-size:.78rem;margin-top:3px}
.out{display:block;margin:20px auto;background:none;border:0;color:#7a6652;text-decoration:underline;cursor:pointer;font-size:.95rem}
.note{font-size:.85rem;color:#7a6652;margin:6px 4px}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
