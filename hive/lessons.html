<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Hive Lessons</title>
<style>
:root{--ink:#4a3a30;--soft:#9b8576;--line:#eadfce;--grn:#2e8b57;--blu:#1565c0;--org:#ef6c00;--red:#c62828}
*{box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{margin:0;background:linear-gradient(160deg,#fff7ef,#ffe7d4);color:var(--ink);min-height:100vh;padding-bottom:70px;line-height:1.5}
#app{max-width:860px;margin:0 auto;padding:12px 14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.top h1{font-size:1.4rem;margin:0}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:800;font-size:.95rem;cursor:pointer;background:var(--ink);color:#fff;text-decoration:none;display:inline-block}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.grn{background:var(--grn)}
.list{display:grid;gap:10px}
.lc{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 3px 10px rgba(74,58,48,.1);display:flex;gap:12px;align-items:center;cursor:pointer;border:0;text-align:left;width:100%}
.lc .n{background:var(--blu);color:#fff;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.lc small{display:block;color:var(--soft)}.lc .ok{margin-left:auto;color:var(--grn);font-weight:900}
h2.sec{margin:20px 0 8px;font-size:1.05rem;color:var(--soft)}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 10px rgba(74,58,48,.1)}
.card h2{margin:0 0 4px}.card h3{margin:16px 0 6px}
ol.steps{padding-left:0;list-style:none;counter-reset:s;margin:6px 0}
ol.steps li{counter-increment:s;position:relative;padding:8px 0 8px 42px;border-top:1px solid #f3eadc}
ol.steps li:first-child{border-top:0}
ol.steps li:before{content:counter(s);position:absolute;left:0;top:8px;width:30px;height:30px;border-radius:50%;background:var(--org);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center}
.btnname{display:inline-block;background:#fff4e6;border:1px solid #f1c48e;border-radius:8px;padding:0 8px;font-weight:800;font-size:.92em;white-space:nowrap}
.tip{background:#eef6ff;border:1px solid #bcd6f5;border-radius:10px;padding:10px 12px;margin:10px 0}
.stop{background:#fdecec;border:1px solid #f3b8b8;border-radius:10px;padding:10px 12px;margin:10px 0}
.practice{background:#f6fbf7;border:2px dashed #7fc79a;border-radius:14px;padding:12px;margin:12px 0}
.kr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;margin:6px 0}
.kr.in{border-left:5px solid var(--grn)}.kr.out{border-left:5px solid #999}.kr.none{border-left:5px solid #ddd}
.kr .kn{flex:1;min-width:120px}.kr small{color:var(--soft);display:block}
.qb{border:0;border-radius:10px;padding:10px 16px;font-weight:900;color:#fff;cursor:pointer;min-width:84px}
.qb.in{background:var(--grn)}.qb.out{background:var(--org)}.qb.back{background:#6b7fd7}
.chip2{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-weight:800;cursor:pointer}
.chip2.on{background:var(--grn);color:#fff;border-color:var(--grn)}
.pfeed{font-weight:700;margin-top:6px}
.q{margin:12px 0}.q label{display:block;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer}
.q label.good{background:#e3f4e8;border-color:#7fc79a}.q label.bad{background:#fdecec;border-color:#f3b8b8}
.who{display:inline-block;font-size:11px;font-weight:800;color:#fff;border-radius:7px;padding:1px 7px;margin-right:6px;vertical-align:1px}
.w-t{background:#2e8b57}.w-d{background:#1565c0}.w-b{background:#8e6bd6}
.fi{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:16px;margin:6px 0}
.msg{min-height:20px;font-weight:700;color:var(--grn)}
</style></head>
<body><div id="app"></div>
<script>
const PIN=sessionStorage.getItem('hivePin'), ROLE=sessionStorage.getItem('hiveRole')||'teacher';
if(!PIN) location.href='index.html';
const HOME = ROLE==='director' ? 'director.html' : (ROLE==='owner' ? 'owner.html' : 'teacher.html');
const $=id=>document.getElementById(id);
function dn(){try{return JSON.parse(localStorage.getItem('hiveLessonsDone')||'{}')}catch(e){return {}}}
function setDone(id){try{var d=dn();d[id]=new Date().toISOString().slice(0,10);localStorage.setItem('hiveLessonsDone',JSON.stringify(d))}catch(e){}}
const B=t=>'<span class="btnname">'+t+'</span>';
const T='<span class="who w-t">Teacher</span>', D='<span class="who w-d">Director</span>', ALL='<span class="who w-b">Everyone</span>';

/* practice widgets: sample names only, nothing is saved anywhere */
const PRACTICE={
 sign:function(){return {html:'<div class="practice"><b>Practice (nothing here is saved).</b> Tap IN, then OUT, then Back IN. Tap B, L and P to mark meals.<div id="pk"></div><div class="pfeed" id="pf"></div></div>',init:function(){
  var kids=[{n:'Sample A.',s:'none',m:{}},{n:'Sample B.',s:'none',m:{}},{n:'Sample C.',s:'none',m:{}}];
  function draw(){var c=kids.filter(k=>k.s==='in').length;
   $('pk').innerHTML=kids.map(function(k,i){var lbl=k.s==='none'?'IN':(k.s==='in'?'OUT':'Back IN'),cl=k.s==='none'?'in':(k.s==='in'?'out':'back');
    return '<div class="kr '+k.s+'"><div class="kn"><b>'+k.n+'</b><small>'+(k.s==='none'?'Not in':(k.s==='in'?'In now':'Out'))+'</small></div><button class="qb '+cl+'" onclick="PS.q('+i+')">'+lbl+'</button>'
    +['B','L','P'].map(function(m){return '<button class="chip2'+(k.m[m]?' on':'')+'" onclick="PS.m('+i+',\''+m+'\')">'+m+'</button>'}).join('')+'</div>';}).join('');
   $('pf').textContent=c+' in the room now.';}
  window.PS={q:function(i){var k=kids[i];k.s=k.s==='none'?'in':(k.s==='in'?'out':'in');draw()},m:function(i,m){kids[i].m[m]=!kids[i].m[m];draw()}};draw();}}},
 count:function(){return {html:'<div class="practice"><b>Practice.</b> Three children are in the room. Type the number you count, then tap Check.<div style="margin:8px 0">Board says: <b>3 in room</b></div><input class="fi" id="pc" type="number" inputmode="numeric" placeholder="How many do you count?" style="max-width:220px"> <button class="btn" onclick="PS2.go()">Check</button><div class="pfeed" id="pf2"></div></div>',init:function(){
  window.PS2={go:function(){var v=+$('pc').value;$('pf2').textContent=v===3?'Match. The count is saved and the headcount timer starts over.':'Does not match. Recount every child by name, then fix the board (sign out anyone who left) before you save.';}}}}}
};
const LESSONS=[
{id:'A1',sec:'A. Daily Rooms Board',title:'Rooms Board basics',min:5,intro:'The Rooms Board is where every child is signed in and out and every meal is marked. Everything else (the paper roster, ELC, KidKare) is built from what you tap here.',
 steps:[
 [ALL,'Open the Rooms Board from your portal card '+B('Classroom Attendance')+'. Type your PIN and tap '+B('Open my rooms')+'. Teachers pick their school; directors are set automatically.'],
 [ALL,'You see one big tile per classroom. Each tile shows how many children are in, the ratio right now, and any red notice such as '+B('Headcount due')+'.'],
 [T,'Tap your room tile. You land on '+B('Sign In / Out')+'. Check that the date at the top says '+B('Today')+'. If it says '+B('Back-fill')+', you are on an old day.'],
 [T,'A child arrives: tap the green '+B('IN')+' button next to their name. The time is stamped for you. The button turns orange '+B('OUT')+'.'],
 [T,'A child goes home: tap '+B('OUT')+'. If they come back the same day, tap '+B('Back IN')+'.'],
 [T,'Several children at once: tick their boxes, set the time, and tap '+B('Sign IN')+' or '+B('Sign OUT')+'. '+B('Check all IN')+' signs in the whole room at one time.'],
 [T,'Meals: tap '+B('B')+' for breakfast, '+B('L')+' for lunch and '+B('P')+' for PM snack on each child, or use '+B('B all')+', '+B('Lunch all')+', '+B('PM Snack all')+' for the whole room. A green chip means it is marked.'],
 [ALL,'Look at the small word at the top right: it says '+B('Saved')+' when your taps are stored. If it says Saving, wait a second before you leave the page.']
 ],
 tip:'Charles also fills in meals from the ProCare times at 12:45, 3:45 and 5:45. He only adds marks. He never removes one that you or a director made.',
 stop:'Sign a child in only when you can see the child. Do not sign children in ahead of time or sign everyone out at once to "clean up" the board.',
 practice:'sign',
 quiz:[
  {q:'A child walks in at 8:10. What do you do?',a:['Tap IN next to the name','Wait until 9:00 and sign in everyone together','Tap B and L only'],c:0,w:'Tap IN right when they arrive so the real time is stamped.'},
  {q:'What does a green chip on B, L or P mean?',a:['That meal is marked for the child','The child is absent','A director signed it'],c:0,w:'Green means the meal is marked.'},
  {q:'The top of the screen says Back-fill. What does it mean?',a:['You are looking at a past day','The board is full','Charles is filling in the meals'],c:0,w:'Back-fill means an older date. Tap Today to return.'}]},
{id:'A2',sec:'A. Daily Rooms Board',title:'Leaving the room and moving children',min:5,intro:'Whenever children leave your room (playground, another classroom, a walk) you sweep and count first, then count again when you return. The board keeps the proof.',
 steps:[
 [T,'Open your room and tap the '+B('Leave Room')+' tab.'],
 [T,'Tap '+B('Leave the room, sweep &amp; count first')+'. Look in the room, bathroom and cots. Type the number of children you are taking. It must match the number on the board.'],
 [T,'Pick where you are going, then tap '+B('Leave now')+'. A banner now shows "With class at ..." with the time you left.'],
 [T,'When you are back, tap '+B('Return to room')+', count again, type the number, and tap '+B('Back in room')+'. The trip is saved under "Today\'s transitions".'],
 [T,'A child moves to a different room for the day (for example a visitor, or a child going up an age group): tick the child, then tap '+B('Move…')+' and pick the room. The child shows as "Moved to another room today" on the old sheet.']
 ],
 tip:'If the count does not match, do not save it. Recount by name. A mismatch means someone is not where the board says.',
 stop:'Never leave the room with a number you did not actually count.',
 quiz:[
  {q:'Before you leave the room you...',a:['Sweep and count, then tap Leave now','Tap Leave now and count on the way','Wait for a director'],c:0,w:'Sweep and count first, every time.'},
  {q:'You are back from the playground. What is the last step?',a:['Return to room, count, and tap Back in room','Nothing, the board knows','Tap OUT for everyone'],c:0,w:'Return to room, count again, tap Back in room.'}]},
{id:'A3',sec:'A. Daily Rooms Board',title:'Headcounts, ratios and your times',min:5,intro:'Licensing wants a headcount about every 10 minutes and the right number of adults for the ages in the room. The board tracks both for you.',
 steps:[
 [T,'On the '+B('Leave Room')+' tab, tap '+B('Record a headcount')+' (or '+B('Count now')+' on a red banner). Count every child by name, type the number, and save.'],
 [T,'A red '+B('Headcount due')+' tag on your tile means it has been too long. Count and save to clear it.'],
 [T,'Open the '+B('Staff &amp; Ratio')+' tab. When you start in the room, tap '+B('Time IN')+' next to your name. When you leave the room for the day or for a break, tap '+B('Time OUT')+'. You can have up to 3 in/out pairs a day.'],
 [T,'A teacher is coming in to help: pick their name in the list, then tap '+B('Add &amp; time IN')+'.'],
 [ALL,'The grid "Children : Staff by hour" fills itself in from sign-ins and staff times. A red box means too many children for the adults in the room (4s are 20:1, 3s are 15:1, 2s are 11:1).'],
 [D,'Directors tap a time slot and enter the director PIN to put their management initials on that hour.']
 ],
 tip:'Fix a red ratio right away: bring in another teacher and stamp them IN, or move children to a room with enough adults.',
 stop:'Stamp your own time only for real arrivals and departures. Do not time out early to "save" hours.',
 practice:'count',
 quiz:[
  {q:'About how often do you record a headcount?',a:['Every 10 minutes','Once a day','Only when leaving the room'],c:0,w:'Every 10 minutes.'},
  {q:'A ratio box turns red. What does that mean?',a:['Too many children for the adults in the room','The teacher is late','The headcount is wrong'],c:0,w:'Red means over the limit.'}]},
{id:'A4',sec:'A. Daily Rooms Board',title:'Fixing a mistake',min:4,intro:'Everyone taps the wrong thing sometimes. Almost everything on the board can be fixed in a few seconds.',
 steps:[
 [T,'Tapped OUT by mistake? The button now says '+B('Back IN')+'. Tap it and the child is in the room again.'],
 [T,'A meal chip is wrong? Tap the same chip again to turn it off or on.'],
 [T,'Wrong time on a staff stamp? Open '+B('Staff &amp; Ratio')+', tap '+B('Edit times')+', change the time, and tap '+B('Save times')+'. Teachers enter the director code; directors and Mrs. Bear can change them freely.'],
 [T,'Forgot to sign a child in yesterday? Use the arrows at the top to go to that date (it says Back-fill) and sign them in at the real time, then tap '+B('Today')+'.'],
 [T,'An accident or illness note is wrong? Tap '+B('AR')+' or '+B('IR')+' on that child, fix the text and tap '+B('Save')+', or tap '+B('Remove report')+'.'],
 [D,'Open '+B('Questions to answer')+' from the board. Each flag has an '+B('Submit answer')+' box, or fix it with '+B('Remove child from this day')+'.']
 ],
 tip:'If ProCare has a time for a child, Charles uses the ProCare time. A time you typed for a child who is in ProCare may be replaced. If that surprises you, tell your director.',
 stop:'Never change a time to something that did not happen.',
 quiz:[
  {q:'You tapped OUT on the wrong child. What do you do?',a:['Tap Back IN','Delete the child','Wait for a director'],c:0,w:'Tap Back IN.'},
  {q:'You forgot to sign someone in yesterday. What do you do?',a:['Go to yesterday with the arrows and sign them in at the real time','Sign them in today','Leave it'],c:0,w:'Use the date arrows, then come back with Today.'}]},
{id:'A5',sec:'A. Daily Rooms Board',title:'School-agers, lunch and director questions',min:4,intro:'School-age children are away at school on school days, so the board treats them differently. This lesson explains what you will see.',
 steps:[
 [ALL,'On a school day, school-agers are signed out at 8:00 AM and signed back in when they return (about 3:15 PM, or 2:15 PM on early-release Wednesdays). Real times from the transportation log are used when they exist.'],
 [ALL,'School-agers get snack only on school days. They get lunch only on days off, or when a director confirms it.'],
 [D,'If a school-ager was here at lunch time on a day that may be a school holiday, a question appears in '+B('Questions to answer')+'. Tap '+B('Holiday - add lunch')+' if school was out and they were here, or '+B('Remove child from this day')+' if they were not here.'],
 [T,'If a pop-up asks "Here for lunch?" for a school-ager, answer '+B('Yes, here for lunch - NOT a holiday')+' only when you saw the child eating lunch with you.']
 ],
 tip:'This keeps the lunch count honest. The food program only pays for meals a child really ate here.',
 stop:'Never add lunch for a school-ager "just in case".',
 quiz:[
  {q:'Which meal do school-agers normally get on a school day?',a:['Snack after they return','Breakfast and lunch','All three meals'],c:0,w:'Snack after school.'},
  {q:'When do you answer Yes to the lunch pop-up?',a:['When you saw the child eat lunch here','Always','When the child is on the roster'],c:0,w:'Only when you saw it.'}]},
{id:'A6',sec:'A. Daily Rooms Board',title:'Put the board on your phone or tablet',min:3,intro:'You can open the Rooms Board with one tap from your home screen, like an app.',
 steps:[
 [ALL,'On the Rooms Board login page, tap '+B('How do I put this on my phone like an app?')+'. The steps for your kind of phone are right there.'],
 [ALL,'iPhone or iPad (Safari): tap Share, then '+B('Add to Home Screen')+'. Android or Chromebook (Chrome): tap the three dots, then '+B('Add to Home screen')+' or '+B('Install')+'.'],
 [ALL,'If Create shortcut is gray, you are in Guest mode. Make a profile for yourself first, then try again.'],
 [ALL,'Never save your PIN in a shared device. When you are done, tap the log out button at the top right.']
 ],
 tip:'If the screen looks too big, lower the display size or zoom in your device settings.',
 stop:'Do not take photos of the board and send them by text. Children\'s information stays in the Hive.',
 quiz:[
  {q:'The Create shortcut button is gray. What is the likely cause?',a:['You are in Guest mode','Your PIN expired','The board is down'],c:0,w:'Guest mode blocks shortcuts. Create a profile.'}]},
{id:'B1',sec:'B. Facility and Incidents',title:'Daily facility checklists',min:6,intro:'Every day each room and the building have checklists. They are the proof for DCF that the center is clean and safe. Walking the room and doing the work is the real job; the Hive records it.',
 steps:[
 [T,'From your portal tap '+B('Facility Checklists')+'. Pick your room and the date.'],
 [T,'Cleaning: the '+B('Classroom Cleaning (Bee Clean Chart)')+' and '+B('Bathroom Cleaning')+' (8 AM, 10 AM, 12 PM, 2 PM, 4 PM, 6 PM). Tick each item when it is done, not before.'],
 [T,'Inspections: the '+B('Indoor Inspection')+' for your room, the '+B('Playground Inspection')+' before children go out, and '+B('Sanitation &amp; Safety')+'.'],
 [T,'Temps and security: record the real fridge, freezer and water temperatures, and confirm doors are locked and the sign-in sheet matches who is here.'],
 [T,'End of day: two closing staff do a visual sweep of the building and playgrounds, then submit '+B('End-of-day building sweep')+'.'],
 [T,'If an item is not OK, mark it flagged and write what is wrong. A flagged item is never ticked as fine.'],
 [D,'Open '+B('DCF Binder')+', then the '+B('Missing')+' tab. Anything not turned in is red. Tap it to fill it in, or ask the teacher. Walk every classroom each day.']
 ],
 tip:'The Official Forms tab shows the real paper forms filled in from what you entered. Anything not updated shows red, so you can see gaps before an inspector does.',
 stop:'Never tick something that was not done. Real temperatures and real events only. The monthly packet will not invent them.',
 quiz:[
  {q:'When do you tick a checklist item?',a:['After the job is actually done','At the start of the day for everything','When a director asks'],c:0,w:'Only after it is done.'},
  {q:'A fridge reads a bad temperature. What do you do?',a:['Write the real number and flag it, then tell a director','Write a normal number','Skip the item'],c:0,w:'Real readings only, and flag problems.'}]},
{id:'B2',sec:'B. Facility and Incidents',title:'Accident and illness reports',min:6,intro:'When a child is hurt or becomes sick, you write down exactly what happened, tell the parent, and the director signs off. The same facts must be in the board and the paper form.',
 steps:[
 [T,'Care for the child first. Get a director if the injury is more than minor.'],
 [T,'On the Rooms Board, in your room under '+B('Sign In / Out')+', tap '+B('AR')+' on the child for an accident or '+B('IR')+' for an illness. Write what happened, where, the time, what you did, and who was told. Tap '+B('Save')+'.'],
 [T,'Write only facts you saw or were told. If you do not know something, leave it out; never guess.'],
 [T,'If another child was involved, write "another child" or "a friend". Never write the other child\'s name in a child\'s report.'],
 [T,'Tell the parent in person at pick-up, or call right away for head injuries or anything serious. Tell your director what you said and the time.'],
 [D,'The paper Accident/Incident Form is filled from your notes. Print it, get the teacher, director and parent signatures, and give each family only its own child\'s form. File the signed copy in Reporting (DCF).']
 ],
 tip:'On the board, the red tag "1 accident report(s)" on a room tile shows the director that a report was written.',
 stop:'Never post incident details in group chats, text, or social media. Never name the other child to a parent.',
 quiz:[
  {q:'Two children bumped heads. In Child A\'s report you write...',a:['"another child"','The other child\'s full name','Nothing'],c:0,w:'Never name the other child.'},
  {q:'You are not sure which toy caused the scrape. You...',a:['Leave it out or say you are not sure','Make your best guess','Ask the parent to decide'],c:0,w:'Only facts.'}]},
{id:'B3',sec:'B. Facility and Incidents',title:'When something says "Not updated yet"',min:3,intro:'Red and "Not updated yet" are not scary. They simply show what is still missing. Here is what to do for each.',
 steps:[
 [ALL,'A red box on a form or in the '+B('Missing')+' list means no teacher has entered it for that day.'],
 [T,'If you did the work but forgot to enter it, open that form and enter it now. The record shows the time you entered it.'],
 [D,'If a teacher forgot but you saw it done, a director can add it; the record shows it was entered by a director.'],
 [D,'If it was not done, leave it blank and fix the problem. Do not enter it to make the list look good.'],
 [ALL,'At month end, Charles builds the monthly facility packet. Days nobody entered are filled with the room\'s usual items, with no names, times, temperatures or incidents invented. If a day was not done, tell Charles and it stays blank.']
 ],
 tip:'Keeping up daily is easier than catching up. Ten minutes at the end of each day clears the board.',
 stop:'Never edit one day to cover another day that was missed.',
 quiz:[
  {q:'You did the room inspection but forgot to enter it. What do you do?',a:['Enter it now','Ignore it','Tell the parent'],c:0,w:'Enter it. It will show when it was entered.'}]}
];


/* ---- continuing-education certificate: goes to the staff member's file; the director or owner signs it there ---- */
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtD(d){if(!d)return '';var p=d.split('-');return p[1]+'/'+p[2]+'/'+p[0];}
function durH(h){h=Number(h);return h<1?Math.round(h*60)+' minutes':(Math.round(h*100)/100)+' hours';}
function ls(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function certSent(id){try{return JSON.parse(localStorage.getItem('hiveCertSent')||'{}')[id+'-'+new Date().getFullYear()]||null}catch(e){return null}}
function markSent(id,c){try{var d=JSON.parse(localStorage.getItem('hiveCertSent')||'{}');d[id+'-'+new Date().getFullYear()]=c;localStorage.setItem('hiveCertSent',JSON.stringify(d))}catch(e){}}
function certHtml(name,school,t){
 return '<!doctype html><meta charset="utf-8"><title>Certificate</title><style>body{font-family:Georgia,serif;margin:0;padding:30px;text-align:center;color:#2b2b2b}.b{border:8px double #1d4e89;padding:40px 30px;max-width:760px;margin:0 auto}h1{font-size:34px;margin:0 0 6px;color:#1d4e89}.n{font-size:30px;margin:16px 0;border-bottom:2px solid #999;display:inline-block;padding:0 24px}.sm{color:#555;font-size:14px}.sg{margin-top:34px}.sg div{border-top:1px solid #444;padding-top:6px;font-size:13px;max-width:380px;margin:0 auto}@media print{button{display:none}}</style>'
 +'<div class="b"><div class="sm">Kid City USA — '+esc(school)+'</div><h1>Certificate of In-Service Training</h1><div class="sm">This certifies that</div><div class="n">'+esc(name)+'</div><div class="sm">completed the training lesson</div><h2 style="margin:10px 0">'+esc(t.title)+'</h2><div>'+durH(t.hrs)+' of in-service training · '+fmtD(t.date)+'</div>'
 +'<div class="sm" style="margin-top:8px">In-house training at Kid City USA. Keep in the staff file.</div><div class="sg"><div>Director / Owner signature (signed in the staff file)</div></div></div><p><button onclick="print()">Print</button></p>';}
function certBox(){
 var l=CUR,c=certSent(l.id);
 if(c){return '<div class="card" style="background:#f6fbf7;border:2px solid #7fc79a"><b>🎓 Certificate sent to '+esc(c.name)+'\'s file.</b><div style="color:var(--soft)">Your director or Mrs. Bear signs it there. You cannot change it after it is sent.</div><button class="btn sec" onclick="showCert()">Print my copy</button></div>';}
 return '<div class="card" style="background:#fffbea;border:2px solid #f0c040"><b>🎓 Get my certificate</b> <span style="color:var(--soft)">('+durH(l.min/60)+' of in-service training)</span><div style="color:var(--soft);font-size:.9rem;margin:4px 0">It goes into your staff file so you do not have to keep paper. Pick your name, then send.</div>'
  +(ROLE==='teacher'?'<select class="fi" id="cs" onchange="loadNames()"><option value="">Which school?</option><option>Sanford</option><option>DeLand 2</option></select>':'')
  +'<select class="fi" id="cn"><option value="">'+(ROLE==='teacher'?'Pick your school first':'Loading names…')+'</option></select><button class="btn grn" id="cb" onclick="sendCert()">Send certificate to my file</button><div class="msg" id="cm"></div></div>';}
var NAMES=[];
function loadNames(){
 var sc=$('cs')?$('cs').value:'';var s=$('cn');if(!s)return;if(ROLE==='teacher'&&!sc){s.innerHTML='<option value="">Pick your school first</option>';return;}
 s.innerHTML='<option value="">Loading names…</option>';
 fetch('files-api.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:PIN,action:'staff_names',school:sc})}).then(r=>r.json()).then(function(j){if(j.error)throw new Error(j.error);NAMES=j.staff;
  s.innerHTML='<option value="">Pick your name</option>'+NAMES.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>'}).join('');
 }).catch(function(e){s.innerHTML='<option value="">Could not load names</option>';if($('cm')){$('cm').style.color='#c62828';$('cm').textContent=e.message||'Could not load names.';}});}
function sendCert(){
 var id=$('cn').value,m=$('cm'),sc=$('cs')?$('cs').value:'';m.style.color='#c62828';
 if(ROLE==='teacher'&&!sc){m.textContent='Pick your school.';return;}if(!id){m.textContent='Pick your name.';return;}
 $('cb').disabled=true;m.style.color='';m.textContent='Sending…';
 fetch('files-api.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:PIN,action:'cert_submit',school:sc,id:id,lesson:CUR.id,title:'Lesson '+CUR.id+': '+CUR.title,hrs:Math.round(CUR.min/60*100)/100})}).then(r=>r.json()).then(function(j){
  if(j.error)throw new Error(j.error);markSent(CUR.id,j.cert);$('cert').innerHTML=certBox();
 }).catch(function(e){$('cb').disabled=false;m.style.color='#c62828';m.textContent=e.message||'Could not send. Try again.';});}
function showCert(){var c=certSent(CUR.id);if(!c)return;var w=window.open('about:blank','_blank');if(!w)return;w.document.write(certHtml(c.name,c.school,c));w.document.close();}

let CUR=null;
function home(){
 var d=dn(),secs={},html='<div class="top"><h1>🎓 Lessons</h1><div><a class="btn sec" href="'+HOME+'">‹ Back to portal</a></div></div><div style="color:var(--soft);font-weight:600;margin-bottom:8px">Short lessons. Each has steps, a practice, and a quick check.</div>';
 LESSONS.forEach(function(l){(secs[l.sec]=secs[l.sec]||[]).push(l)});
 Object.keys(secs).forEach(function(s){html+='<h2 class="sec">'+s+'</h2><div class="list">'+secs[s].map(function(l){return '<button class="lc" onclick="open_(\''+l.id+'\')"><span class="n">'+l.id+'</span><span><b>'+l.title+'</b><small>'+l.min+' min</small></span>'+(d[l.id]?'<span class="ok">✓ Done</span>':'')+'</button>'}).join('')+'</div>'});
 $('app').innerHTML=html;window.scrollTo(0,0);CUR=null;
}
function open_(id){
 var l=LESSONS.find(x=>x.id===id);CUR=l;
 var h='<div class="top"><h1>'+l.id+'. '+l.title+'</h1><button class="btn sec" onclick="home()">‹ All lessons</button></div><div class="card"><div>'+l.intro+'</div>';
 h+='<h3>Step by step</h3><ol class="steps">'+l.steps.map(s=>'<li>'+s[0]+s[1]+'</li>').join('')+'</ol>';
 h+='<div class="tip"><b>Good to know:</b> '+l.tip+'</div><div class="stop"><b>Do not:</b> '+l.stop+'</div>';
 var pr=l.practice?PRACTICE[l.practice]():null;
 if(pr)h+=pr.html;
 l.quiz.forEach(function(q){q._o=q.a.map(function(_,k){return k}).sort(function(){return Math.random()-.5})});
 h+='<h3>Quick check</h3>'+l.quiz.map(function(q,i){return '<div class="q" id="q'+i+'"><b>'+(i+1)+'. '+q.q+'</b>'+q._o.map(function(j){return '<label onclick="ans('+i+','+j+')">'+q.a[j]+'</label>'}).join('')+'<div class="msg" id="qm'+i+'"></div></div>'}).join('');
 h+='<button class="btn grn" onclick="finish()">✓ Mark lesson complete</button><div class="msg" id="fin"></div><div id="cert"></div>';
 h+='<h3>Is a step missing or wrong?</h3><textarea class="fi" id="fb" rows="3" placeholder="Tell Mrs. Bear what is missing or confusing"></textarea><input class="fi" id="fn" placeholder="Your name" maxlength="60"><button class="btn sec" onclick="sendFb()">Send to Mrs. Bear</button><div class="msg" id="fbm"></div></div>';
 $('app').innerHTML=h;window.scrollTo(0,0);if(pr)pr.init();
 if(dn()[l.id]){$('cert').innerHTML=certBox();if(!certSent(l.id)&&ROLE!=='teacher')loadNames();}
 try{$('fn').value=localStorage.getItem('hiveName')||''}catch(e){}
}
var ANS={};
function ans(i,j){var q=CUR.quiz[i];var labs=document.querySelectorAll('#q'+i+' label');labs.forEach(function(x,k){var jj=q._o[k];x.className=jj===q.c?'good':(jj===j?'bad':'')});ANS[CUR.id+i]=(j===q.c);$('qm'+i).textContent=j===q.c?'Correct!':q.w;$('qm'+i).style.color=j===q.c?'':'#c62828';}
function finish(){var ok=CUR.quiz.every((q,i)=>ANS[CUR.id+i]);if(!ok){$('fin').style.color='#c62828';$('fin').textContent='Answer every quick-check question correctly first.';return;}
 setDone(CUR.id);$('fin').style.color='';$('fin').textContent='Lesson complete. Great job!';$('cert').innerHTML=certBox();if(!certSent(CUR.id)&&ROLE!=='teacher')loadNames();}
function sendFb(){var tx=$('fb').value.trim(),nm=$('fn').value.trim();var m=$('fbm');m.style.color='#c62828';
 if(!tx||!nm){m.textContent='Type your note and your name.';return;}
 try{localStorage.setItem('hiveName',nm)}catch(e){}
 if(ROLE!=='director'){m.textContent='Please tell your director or Mrs. Bear this note in person for now.';return;}
 fetch('training-api.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:PIN,action:'submit',module:'Lesson '+CUR.id+' '+CUR.title,verdict:'miss',text:tx,name:nm})}).then(r=>r.json()).then(j=>{if(j.error)throw new Error(j.error);m.style.color='';m.textContent='Sent. Thank you!';}).catch(e=>{m.textContent=e.message||'Could not send.';});}
home();
if(location.hash){var _h=location.hash.slice(1);if(LESSONS.some(x=>x.id===_h))open_(_h)}
</script></body></html>
